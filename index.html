<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกเคส - รพ.สะเดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .tab-btn { border-bottom: 3px solid transparent; }
        .tab-btn.active { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: 600; }
        .tab-dashboard.active { border-bottom: 3px solid #ea580c; color: #ea580c; font-weight: 600; }
        .instructor-radio:checked + label { border-color: #16a34a; background-color: #f0fdf4; }
        .instructor-radio:checked + label .check-icon { display: flex; }
    </style>
</head>
<body class="pb-20">

    <div class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between mb-4 shadow-sm">
        <div>
            <h1 class="text-lg font-bold text-green-800">TTMED STUDY</h1>
            <p class="text-xs text-gray-500">บันทึกเคส รพ.สะเดา</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="text-right">
                <p id="userName" class="text-sm font-semibold text-gray-800">กำลังโหลด...</p>
                <p id="userRole" class="text-[10px] text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full inline-block">Connecting</p>
            </div>
            <img id="userImg" src="https://ui-avatars.com/api/?name=User" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-xl overflow-hidden flex mb-6 text-[13px] text-gray-500 shadow-sm bg-white">
            <button onclick="switchTab('massage')" id="tab-massage" class="tab-btn active flex-1 py-3 text-center transition-all">นวดไทย</button>
            <button onclick="switchTab('midwifery')" id="tab-midwifery" class="tab-btn flex-1 py-3 text-center transition-all">ผดุงครรภ์</button>
            <button onclick="switchTab('medicine')" id="tab-medicine" class="tab-btn flex-1 py-3 text-center transition-all">เวชกรรม</button>
            <button onclick="switchTab('dashboard'); loadDashboardData();" id="tab-dashboard" class="hidden tab-btn tab-dashboard flex-1 py-3 text-center transition-all text-orange-600 bg-orange-50/50"><i class="fa-solid fa-clipboard-check"></i> ตรวจ</button>
        </div>

<!-- ================= ฟอร์ม: นวดไทย ================= -->
        <div id="form-massage" class="glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-green-700 mb-4 border-b border-green-200 pb-2">บันทึกเคสนวดไทย</h2>
            <form onsubmit="submitForm(event, 'massage')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่รับบริการ</label><input type="date" id="msg_date" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN</label><input type="text" id="msg_hn" placeholder="ระบุ HN" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="msg_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>

                <div class="p-3 bg-green-50/50 rounded-xl border border-green-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">ประเภทเคส</label>
                            <select id="msg_caseType" class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none">
                                <option value="New">🌟 เคสใหม่</option>
                                <option value="FollowUp">🔄 ติดตามผล</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">กลุ่มโรค</label>
                            <select id="msg_diseaseCategory" class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none">
                                <option value="โรคทางหัตถเวชกรรมไทย">หัตถเวชกรรมไทย</option>
                                <option value="กลุ่มโรคไม่ติดต่อเรื้อรัง (NCDs)">NCDs</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อโรค / อาการ</label>
                        <select id="msg_diseaseName" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none">
                            <option value="">-- โหลดข้อมูล... --</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้ตรวจประเมิน</label>
                    <div id="instructors_massage" class="grid grid-cols-3 gap-2"></div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl transition shadow-md mt-2">บันทึกและแจ้งเตือนอาจารย์</button>
            </form>
        </div>

        <!-- ================= ฟอร์ม: ผดุงครรภ์ ================= -->
        <div id="form-midwifery" class="hidden glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-pink-600 mb-4 border-b border-pink-200 pb-2">บันทึกเคสผดุงครรภ์ไทย</h2>
            <form onsubmit="submitForm(event, 'midwifery')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่</label><input type="date" id="mid_date" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN มารดา</label><input type="text" id="mid_hn" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล มารดา</label><input type="text" id="mid_patientName" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                
                <div class="pt-2"><label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้ตรวจประเมิน</label><div id="instructors_midwifery" class="grid grid-cols-3 gap-2"></div></div>
                
                <button type="submit" class="w-full bg-pink-600 text-white font-bold py-3 rounded-xl transition shadow-md mt-2">บันทึกและแจ้งเตือนอาจารย์</button>
            </form>
        </div>

        <!-- ================= ฟอร์ม: เวชกรรม ================= -->
        <div id="form-medicine" class="hidden glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-blue-600 mb-4 border-b border-blue-200 pb-2">บันทึกเคสเวชกรรมไทย</h2>
            <form onsubmit="submitForm(event, 'medicine')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่</label><input type="date" id="med_date" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN</label><input type="text" id="med_hn" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="med_patientName" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></div>
                
                <div class="p-3 bg-blue-50/50 rounded-xl border border-blue-100">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">วินิจฉัยโรคแผนไทย</label>
                    <select id="med_diseaseName" required class="w-full bg-white border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none"></select>
                </div>

                <div class="pt-2"><label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้ตรวจประเมิน</label><div id="instructors_medicine" class="grid grid-cols-3 gap-2"></div></div>
                
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl transition shadow-md mt-2">บันทึกและแจ้งเตือนอาจารย์</button>
            </form>
        </div>

       <!-- ================= แดชบอร์ด (เฉพาะอาจารย์) ================= -->
        <div id="form-dashboard" class="hidden glass-card p-5 rounded-2xl mb-6 shadow-sm border-orange-200">
            
            <!-- 1. ส่วนตรวจเคส -->
            <h2 class="font-bold text-orange-600 mb-4 border-b border-orange-200 pb-2"><i class="fa-solid fa-list-check"></i> รายการเคสรอตรวจประเมิน</h2>
            <div id="pending-cases-container" class="space-y-3 mb-6">
                <p class="text-center text-sm text-gray-400 py-6"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูล...</p>
            </div>
            
            <!-- 2. ส่วนติดตามความคืบหน้านักศึกษา -->
            <h2 class="font-bold text-indigo-600 mb-4 border-b border-indigo-200 pb-2"><i class="fa-solid fa-chart-pie"></i> ความคืบหน้านักศึกษา</h2>
            <div id="student-stats-container" class="space-y-4 mb-6"></div>

            <!-- 3. ส่วนแสดงอันดับโรค (RANK) -->
            <h2 class="font-bold text-teal-600 mb-4 border-b border-teal-200 pb-2"><i class="fa-solid fa-ranking-star"></i> RANK อันดับโรคที่พบบ่อย</h2>
            <div id="disease-rank-container" class="bg-white rounded-xl p-4 border border-teal-100 shadow-sm"></div>

        </div>

    </div>

    <script>
        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';
        const FIREBASE_SECRET = '9iKYKSmC8ssrUXvEdh2OOqS4JCeyEwcaCGr83WkG';
        const LIFF_ID = "2010280091-6e8mWiGV";
        
        // ⚠️ นำ URL จาก Apps Script มาวางที่นี่ (อย่าลืมเปลี่ยนนะครับ)
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxFeZxtiaQ_TgT6Hzd0bDo19rbM8SjmGVMMid9BQanch9pyEtOB2ivlXtF6tB9xQGuKKQ/exec"; 

        let currentUser = null; 
        let instructorList = [];

        // ================= เริ่มทำงานเมื่อเปิดหน้าเว็บ =================
        window.onload = async () => {
            const today = new Date();
            document.getElementById('msg_date').valueAsDate = today;
            document.getElementById('mid_date').valueAsDate = today;
            document.getElementById('med_date').valueAsDate = today;

            await loadDropdownConfigs();
            await fetchUsersAndRenderInstructors(); 
            await initializeLiff();
        };

        // 1. โหลดข้อมูลโรคจาก Firebase
        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`);
                const configs = await res.json();
                
                if (configs?.diseases_massage) {
                    const msgSelect = document.getElementById('msg_diseaseName');
                    msgSelect.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(configs.diseases_massage)) {
                        msgSelect.innerHTML += `<option value="${name}">${code}: ${name}</option>`;
                    }
                }
                if (configs?.diseases_medicine) {
                    const medSelect = document.getElementById('med_diseaseName');
                    medSelect.innerHTML = '<option value="">-- เลือกการวินิจฉัย --</option>';
                    for (const [code, obj] of Object.entries(configs.diseases_medicine)) {
                        // ซ่อนประเภทโรค (obj.type) ไว้ใน data-category
                        medSelect.innerHTML += `<option value="${obj.name}" data-category="${obj.type}">${code}: ${obj.name}</option>`;
                    }
                }
            } catch (e) { console.error(e); }
        }

        // 2. ดึงรูปอาจารย์มาสร้างเป็นปุ่มกด
        async function fetchUsersAndRenderInstructors() {
            try {
                const res = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await res.json();
                for (const uid in users) {
                    if (users[uid].role === 'instructor' && users[uid].isActive) {
                        instructorList.push({ uid: uid, name: users[uid].fullName, picUrl: users[uid].picUrl });
                    }
                }
                ['massage', 'midwifery', 'medicine'].forEach(dep => {
                    const container = document.getElementById(`instructors_${dep}`);
                    if(container) {
                        container.innerHTML = instructorList.map((inst, index) => `
                            <div class="relative">
                                <input type="radio" name="instructor_${dep}" id="inst_${dep}_${index}" value="${inst.uid}" class="instructor-radio hidden" required>
                                <label for="inst_${dep}_${index}" class="cursor-pointer border border-gray-200 rounded-lg p-2 flex flex-col items-center gap-1 transition relative bg-white">
                                    <img src="${inst.picUrl}" class="w-10 h-10 rounded-full object-cover">
                                    <span class="text-[9px] font-bold text-gray-700 text-center truncate w-full">${inst.name.split(' ')[0]}</span>
                                    <div class="check-icon hidden absolute -top-1 -right-1 bg-green-500 text-white w-4 h-4 rounded-full items-center justify-center"><i class="fa-solid fa-check text-[9px]"></i></div>
                                </label>
                            </div>
                        `).join('');
                    }
                });
            } catch (e) { console.error(e); }
        }

        // 3. เริ่มต้นระบบ LIFF และบังคับล็อกอิน
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    checkUserPermission(await liff.getProfile());
                } else { 
                    liff.login(); // บังคับให้หน้าเว็บเด้งไปล็อกอิน LINE ทันที
                }
            } catch (err) { 
                console.error("LIFF Init Error: ", err);
                document.getElementById('userName').innerText = "LIFF Error";
                document.getElementById('userRole').innerText = "ตรวจสอบการตั้งค่า";
                document.getElementById('userRole').className = "text-[10px] text-red-600 bg-red-100 px-2 py-0.5 rounded-full inline-block font-bold";
                alert("⚠️ ระบบ LINE แจ้งข้อผิดพลาด:\n" + err.message + "\n\n💡 สาเหตุที่เป็นไปได้: LIFF ID ผิด หรือ Endpoint URL ในหน้า LINE Developers ไม่ตรงกับเว็บปัจจุบัน");
            }
        }

        // 4. ตรวจสอบสิทธิ์ผู้ใช้งาน
        async function checkUserPermission(profile) {
            try {
                const res = await fetch(`${FIREBASE_URL}users/${profile.userId}.json?auth=${FIREBASE_SECRET}`);
                const userData = await res.json();
                document.getElementById('userImg').src = profile.pictureUrl;
                
                if (userData && userData.isActive) {
                    currentUser = { uid: profile.userId, ...userData };
                    document.getElementById('userName').innerText = userData.fullName;
                    
                    const roleBadge = document.getElementById('userRole');
                    if (userData.role === 'instructor') {
                        roleBadge.innerText = "⭐ อาจารย์ผู้คุม"; 
                        roleBadge.className = "text-[10px] text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full font-bold";
                        document.getElementById('tab-dashboard').classList.remove('hidden'); // ปลดล็อกแท็บแดชบอร์ดให้อาจารย์
                    } else {
                        roleBadge.innerText = "🎓 นักศึกษา"; 
                        roleBadge.className = "text-[10px] text-green-600 bg-green-100 px-2 py-0.5 rounded-full font-bold";
                    }
                } else {
                    document.getElementById('userName').innerText = "ไม่มีสิทธิ์เข้าถึง";
                    document.getElementById('userRole').innerText = "Unregistered";
                }
            } catch (e) { console.error(e); }
        }

        // 5. สลับเมนูด้านบน
        function switchTab(tabId) {
            ['massage', 'midwifery', 'medicine', 'dashboard'].forEach(id => {
                document.getElementById(`form-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('active');
            });
            document.getElementById(`form-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // 6. กดปุ่มส่งเคส
        async function submitForm(e, department) {
            e.preventDefault();
            if (!currentUser) return alert("รอกำลังเชื่อมต่อข้อมูลครับ");
            const selectedInstructor = document.querySelector(`input[name="instructor_${department}"]:checked`);
            if (!selectedInstructor) return alert("กรุณาเลือกอาจารย์ผู้ตรวจก่อนส่งครับ");

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `กำลังส่งข้อมูล...`; btn.disabled = true;

            try {
                let payload = { 
                    action: "submitNewCase", 
                    department: department, 
                    studentUid: currentUser.uid, 
                    studentName: currentUser.fullName, 
                    instructorUid: selectedInstructor.value 
                };
                
                if (department === 'massage') {
                    payload.date = document.getElementById('msg_date').value; 
                    payload.hn = document.getElementById('msg_hn').value;
                    payload.patientName = document.getElementById('msg_patientName').value; 
                    payload.caseType = document.getElementById('msg_caseType').value;
                    payload.diseaseCategory = document.getElementById('msg_diseaseCategory').value;
                    payload.diseaseName = document.getElementById('msg_diseaseName').value;
                } else if (department === 'midwifery') {
                    payload.date = document.getElementById('mid_date').value; 
                    payload.hn = document.getElementById('mid_hn').value;
                    payload.patientName = document.getElementById('mid_patientName').value; 
                } else if (department === 'medicine') {
                    payload.date = document.getElementById('med_date').value; 
                    payload.hn = document.getElementById('med_hn').value;
                    payload.patientName = document.getElementById('med_patientName').value; 
                    
                    const medSelect = document.getElementById('med_diseaseName');
                    payload.diseaseName = medSelect.value;
                    const selectedOption = medSelect.options[medSelect.selectedIndex];
                    payload.diseaseCategory = selectedOption ? selectedOption.getAttribute('data-category') : 'โรคทั่วไป';
                    payload.caseType = 'New';
                }

                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                alert(result.message);
                if (result.success) { 
                    e.target.reset(); 
                    document.getElementById(department+'_date').valueAsDate = new Date(); 
                }
            } catch (err) { 
                alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์"); 
            } finally { 
                btn.innerHTML = originalText; 
                btn.disabled = false; 
            }
        }

        // ================= ระบบ Dashboard (สำหรับอาจารย์) =================
        async function loadDashboardData() {
            if (currentUser.role !== 'instructor') return;
            
            const pendingContainer = document.getElementById('pending-cases-container');
            const statsContainer = document.getElementById('student-stats-container');
            const rankContainer = document.getElementById('disease-rank-container');

            pendingContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดเคสรอตรวจ...</p>';
            statsContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i> กำลังโหลดข้อมูลนักศึกษา...</p>';
            rankContainer.innerHTML = '<p class="text-center text-xs text-gray-400 py-4"><i class="fa-solid fa-spinner fa-spin"></i> กำลังประมวลผล RANK...</p>';

            try {
                // โหลดเคสรอตรวจ
                let pendingHtml = "";
                const deps = ['massage', 'midwifery', 'medicine'];
                
                for (let dep of deps) {
                    const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const cases = await res.json();
                    
                    for (let caseId in cases) {
                        const c = cases[caseId];
                        if (c.status === 'pending' && c.instructorUid === currentUser.uid) {
                            pendingHtml += `
                                <div class="bg-white p-3 rounded-lg border border-orange-200 shadow-sm" id="card_${caseId}">
                                    <div class="flex justify-between items-start mb-2">
                                        <div>
                                            <p class="text-[12px] font-bold text-gray-800">${c.studentName}</p>
                                            <p class="text-[10px] text-gray-500">HN: ${c.hn} | วันที่: ${c.date}</p>
                                        </div>
                                        <span class="text-[9px] bg-orange-100 text-orange-600 px-2 py-0.5 rounded font-bold uppercase">${dep}</span>
                                    </div>
                                    <p class="text-[11px] text-gray-600 mb-3 bg-gray-50 p-2 rounded border border-gray-100">📌 ${c.diseaseName || c.treatment || 'ดูรายละเอียดในกระดาษ'}</p>
                                    
                                    <div class="flex gap-2">
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'approved')" class="flex-1 bg-green-500 text-white text-[10px] font-bold py-1.5 rounded-md hover:bg-green-600 transition"><i class="fa-solid fa-check"></i> ผ่าน</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'returned')" class="flex-1 bg-yellow-500 text-white text-[10px] font-bold py-1.5 rounded-md hover:bg-yellow-600 transition"><i class="fa-solid fa-rotate-left"></i> ส่งคืน</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'rejected')" class="flex-1 bg-red-500 text-white text-[10px] font-bold py-1.5 rounded-md hover:bg-red-600 transition"><i class="fa-solid fa-xmark"></i> ยกเลิก</button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
                pendingContainer.innerHTML = pendingHtml || '<p class="text-center text-xs text-gray-400 py-6">ไม่มีเคสรอตรวจครับ 🎉</p>';

                // โหลดสถิตินักศึกษา
                const usersRes = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await usersRes.json();
                let statsHtml = "";
                
                for (const uid in users) {
                    if (users[uid].role === 'student' && users[uid].isActive) {
                        const st = users[uid].stats || {};
                        const msgTotal = (st.massage_new || 0) + (st.massage_followup || 0);
                        const midTotal = (st.midwifery || 0);
                        const medTotal = (st.medicine_general || 0) + (st.medicine_ncd || 0);

                        statsHtml += `
                            <div class="bg-white p-3 rounded-xl border border-indigo-100 shadow-sm">
                                <div class="flex items-center gap-2 mb-3 border-b border-gray-100 pb-2">
                                    <img src="${users[uid].picUrl}" class="w-8 h-8 rounded-full border border-gray-200">
                                    <p class="text-[12px] font-bold text-gray-800">${users[uid].fullName}</p>
                                </div>
                                <div class="space-y-3">
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-600 mb-1 font-semibold"><span>💆‍♂️ นวดไทย (เป้า 60)</span><span class="text-green-600">${msgTotal}/60</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div class="bg-green-500 h-1.5 rounded-full" style="width: ${Math.min((msgTotal/60)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-600 mb-1 font-semibold"><span>🤰 ผดุงครรภ์ (เป้า 10)</span><span class="text-pink-600">${midTotal}/10</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div class="bg-pink-500 h-1.5 rounded-full" style="width: ${Math.min((midTotal/10)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-600 mb-1 font-semibold"><span>🩺 เวชกรรม (เป้า 20)</span><span class="text-blue-600">${medTotal}/20</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div class="bg-blue-500 h-1.5 rounded-full" style="width: ${Math.min((medTotal/20)*100, 100)}%"></div></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }
                statsContainer.innerHTML = statsHtml || '<p class="text-[11px] text-center text-gray-400 py-4">ยังไม่มีข้อมูลนักศึกษาในระบบ</p>';

                // คำนวณอันดับโรค
                let diseaseCount = {};
                for (let dep of ['massage', 'medicine']) {
                    const caseRes = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const allCases = await caseRes.json();
                    for (let cid in allCases) {
                        if (allCases[cid].status === 'approved' && allCases[cid].diseaseName) {
                            const dName = allCases[cid].diseaseName;
                            diseaseCount[dName] = (diseaseCount[dName] || 0) + 1;
                        }
                    }
                }

                const sortedRank = Object.entries(diseaseCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
                if (sortedRank.length > 0) {
                    let rankHtml = '<ul class="space-y-2.5">';
                    sortedRank.forEach((item, index) => {
                        let medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `<span class="w-5 h-5 flex items-center justify-center bg-gray-100 rounded-full text-[9px] font-bold text-gray-500">${index+1}</span>`;
                        rankHtml += `
                            <li class="flex justify-between items-center text-[11px] border-b border-gray-50 pb-2 last:border-0">
                                <div class="flex items-center gap-2 truncate w-3/4">${medal}<span class="truncate text-gray-700">${item[0]}</span></div>
                                <span class="font-bold text-teal-600 bg-teal-50 px-2 py-0.5 rounded-full">${item[1]} เคส</span>
                            </li>
                        `;
                    });
                    rankHtml += '</ul>';
                    rankContainer.innerHTML = rankHtml;
                } else {
                    rankContainer.innerHTML = '<p class="text-[11px] text-center text-gray-400 py-4">ยังไม่มีข้อมูลเคสที่อนุมัติ</p>';
                }
            } catch(e) { console.error(e); pendingContainer.innerHTML = '<p class="text-center text-sm text-red-400 py-4">ดึงข้อมูลล้มเหลว กรุณาลองใหม่</p>'; }
        }

        async function judgeCase(department, caseId, status) {
            let remark = "";
            if (status !== 'approved') {
                remark = prompt("กรุณาระบุหมายเหตุ (สาเหตุที่ส่งคืน หรือ ยกเลิก):");
                if (remark === null) return; 
            }

            document.getElementById(`card_${caseId}`).style.opacity = '0.5';
            try {
                const payload = { action: "updateCaseStatus", department: department, caseId: caseId, status: status, remark: remark, instructorUid: currentUser.uid };
                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if (result.success) {
                    document.getElementById(`card_${caseId}`).remove();
                    // ให้มันรีเฟรชยอด Progress Bar ใหม่ทันทีหลังจากกดผ่านเคส
                    if (status === 'approved') loadDashboardData(); 
                }
                else { alert(result.message); document.getElementById(`card_${caseId}`).style.opacity = '1'; }
            } catch (err) { alert("Error"); document.getElementById(`card_${caseId}`).style.opacity = '1'; }
        }
    </script>
</body>
</html>
