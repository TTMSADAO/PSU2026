    <style>
        :root {
            --app-bg: #f3f8f8;
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: var(--app-bg);
            /* Mesh Gradient Background สุดพรีเมียม */
            background-image: 
                radial-gradient(at 10% 10%, hsla(153, 100%, 84%, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 10%, hsla(199, 100%, 84%, 0.5) 0px, transparent 50%),
                radial-gradient(at 50% 90%, hsla(43, 100%, 84%, 0.5) 0px, transparent 50%),
                radial-gradient(at 90% 90%, hsla(333, 100%, 88%, 0.5) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* 🔮 Glassmorphism 2.0 */
        .glass-card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255,255,255,1); 
            border-radius: 2.5rem;
        }

        /* 🕹️ Bouncy Inputs */
        .input-wow {
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            border-radius: 1.25rem;
        }
        .input-wow:focus {
            transform: translateY(-3px) scale(1.01);
            background-color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 15px 25px -10px rgba(52, 211, 153, 0.3);
            outline: none;
        }

        /* 🚀 Floating Bottom Nav (แคปซูลลอย) */
        .floating-nav { 
            bottom: 20px;
            width: calc(100% - 32px);
            left: 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1), inset 0 1px 0 rgba(255,255,255,1);
        }
        .nav-item { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item.active { transform: translateY(-8px); }
        .nav-item .icon-box { transition: all 0.4s ease; }
        .nav-item.active .icon-box { transform: scale(1.15); box-shadow: 0 10px 20px -5px currentColor; }

        /* ✨ Buttons Glow & Bounce */
        .btn-glow {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 999px;
            position: relative;
            overflow: hidden;
        }
        .btn-glow::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: all 0.5s ease;
        }
        .btn-glow:hover::after { left: 100%; }
        .btn-glow:active { transform: scale(0.92); }
        
        .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.5); }
        .btn-pink { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.5); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.5); }

        /* 👨‍🏫 Instructor Selection Animation (สไตล์ IG Story) */
        .instructor-radio:checked + label {
            background-color: #ffffff;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px -10px rgba(0,0,0,0.15);
        }
        .instructor-radio:checked + label .avatar-ring {
            background: linear-gradient(45deg, #10b981, #34d399, #fbbf24);
            padding: 3px;
        }
        .instructor-radio:checked + label .check-icon { 
            transform: scale(1) rotate(0deg); opacity: 1; 
        }
        .check-icon { 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            transform: scale(0) rotate(-180deg); opacity: 0; 
        }
        .avatar-ring { transition: all 0.3s ease; padding: 0px; border-radius: 50%; }

        /* 🎬 Page Transitions */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-tab { animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        /* Staggered cards (การ์ดค่อยๆ เด้งขึ้นทีละใบ) */
        .card-stagger { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards; }
    </style>
</head>

        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';

        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycb.../exec";

        let currentUser = null;

        window.onload = async () => {
            const today = new Date();

        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`);
                const configs = await res.json();
                
                if (configs?.diseases_massage) {
                    const msgSelect = document.getElementById('msg_diseaseName');
                    msgSelect.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(configs.diseases_massage)) {
                        msgSelect.innerHTML += `<option value="${name}">${code}: ${name}</option>`;
                    }
                }
                if (configs?.diseases_medicine) {
                    const medSelect = document.getElementById('med_diseaseName');
                    medSelect.innerHTML = '<option value="">-- เลือกการวินิจฉัย --</option>';
                    for (const [code, obj] of Object.entries(configs.diseases_medicine)) {
                        medSelect.innerHTML += `<option value="${obj.name}" data-category="${obj.type}">${code}: ${obj.name}</option>`;
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function fetchUsersAndRenderInstructors() {
            try {
                const res = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await res.json();
                for (const uid in users) {
                    if (users[uid].role === 'instructor' && users[uid].isActive) {
                        instructorList.push({ uid: uid, name: users[uid].fullName, picUrl: users[uid].picUrl });
                    }
                }
                ['massage', 'midwifery', 'medicine'].forEach(dep => {
                    const container = document.getElementById(`instructors_${dep}`);
                    if(container){
                        container.innerHTML = instructorList.map((inst, index) => `
                            <div class="relative">
                                <input type="radio" name="instructor_${dep}" id="inst_${dep}_${index}" value="${inst.uid}" class="instructor-radio hidden" required>
                                <label for="inst_${dep}_${index}" class="cursor-pointer border-2 border-transparent bg-white/50 rounded-[1.5rem] p-2 flex flex-col items-center gap-2 transition-all duration-300 relative shadow-sm hover:bg-white">
                                    <div class="avatar-ring">
                                        <img src="${inst.picUrl}" class="w-11 h-11 rounded-full object-cover border-2 border-white">
                                    </div>
                                    <span class="text-[10px] font-extrabold text-gray-600 text-center truncate w-full">${inst.name.split(' ')[0]}</span>
                                    <div class="check-icon absolute -top-1.5 -right-1.5 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-lg"><i class="fa-solid fa-check text-[11px]"></i></div>
                                </label>
                            </div>
                        `).join('');
                    }
                });
            } catch (e) { console.error(e); }
        }

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    checkUserPermission(await liff.getProfile());
                } else { liff.login(); }
            } catch (err) { 
                document.getElementById('userName').innerText = "LIFF Error";
                document.getElementById('userRole').innerText = "ตรวจสอบตั้งค่า";
                document.getElementById('userRole').className = "text-[9px] font-extrabold text-red-500 bg-red-50 px-3 py-1 rounded-full mt-1 inline-block";
            }
        }

        async function checkUserPermission(profile) {
            try {
                const res = await fetch(`${FIREBASE_URL}users/${profile.userId}.json?auth=${FIREBASE_SECRET}`);
                const userData = await res.json();
                
                const firstName = profile.displayName.split(' ')[0];
                document.getElementById('userName').innerText = userData && userData.isActive ? firstName : profile.displayName;
                document.getElementById('userImg').src = profile.pictureUrl;
                
                const roleBadge = document.getElementById('userRole');
                if (userData && userData.isActive) {
                    currentUser = { uid: profile.userId, ...userData };
                    if (userData.role === 'instructor') {
                        roleBadge.innerText = "⭐ อาจารย์แพทย์"; 
                        roleBadge.className = "text-[9px] font-extrabold text-orange-600 bg-orange-100 px-3 py-1 rounded-full mt-1 inline-block shadow-sm";
                        document.getElementById('nav-dashboard').classList.remove('hidden'); 
                    } else {
                        roleBadge.innerText = "🎓 นักศึกษาฝึกประสบการณ์"; 
                        roleBadge.className = "text-[9px] font-extrabold text-emerald-600 bg-emerald-100 px-3 py-1 rounded-full mt-1 inline-block shadow-sm";
                    }
                } else {
                    document.getElementById('userName').innerText = "Access Denied";
                    roleBadge.innerText = "ไม่มีสิทธิ์ใช้งาน";
                }
            } catch (e) { console.error(e); }
        }

        function switchTab(tabId) {
            const tabs = ['massage', 'midwifery', 'medicine', 'dashboard'];
            
            tabs.forEach(id => {
                const form = document.getElementById(`form-${id}`);
                const nav = document.getElementById(`nav-${id}`);
                
                form.classList.add('hidden');
                form.classList.remove('animate-tab');
                
                if(nav) {
                    nav.classList.remove('active', 'text-emerald-500', 'text-rose-500', 'text-blue-500', 'text-orange-500');
                    nav.classList.add('text-gray-400');
                }
            });

            const activeForm = document.getElementById(`form-${tabId}`);
            const activeNav = document.getElementById(`nav-${tabId}`);
            
            activeForm.classList.remove('hidden');
            void activeForm.offsetWidth; 
            activeForm.classList.add('animate-tab');

            if(activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('active');
                
                if(tabId === 'massage') activeNav.classList.add('text-emerald-500');
                else if(tabId === 'midwifery') activeNav.classList.add('text-rose-500');
                else if(tabId === 'medicine') activeNav.classList.add('text-blue-500');
                else if(tabId === 'dashboard') activeNav.classList.add('text-orange-500');
            }
        }

        // ================= ฟังก์ชันกดส่งเคส & แปลงรูปภาพ =================
        async function submitForm(e, department) {
            e.preventDefault();
            if (!currentUser) return alert("รอระบบโหลดข้อมูลสักครู่ครับ");
            const selectedInstructor = document.querySelector(`input[name="instructor_${department}"]:checked`);
            if (!selectedInstructor) return alert("กรุณาเลือกอาจารย์ผู้ตรวจก่อนส่งครับ");

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-lg"></i> กำลังอัปโหลด...`; 
            btn.disabled = true;

            try {
                let base64String = ""; let mimeType = ""; let fileName = "";
                const fileInput = document.getElementById(`${department === 'massage' ? 'msg' : department === 'midwifery' ? 'mid' : 'med'}_image`);
                
                if (fileInput && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 5 * 1024 * 1024) {
                        alert("⚠️ ไฟล์รูปภาพใหญ่เกินไป กรุณาเลือกไฟล์ที่ขนาดไม่เกิน 5MB ครับ");
                        btn.innerHTML = originalText; btn.disabled = false;
                        return;
                    }
                    fileName = department + "_" + Date.now() + "_" + file.name;
                    mimeType = file.type;
                    
                    base64String = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]); 
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(file);
                    });
                }

                let payload = { 
                    action: "submitNewCase", department: department, studentUid: currentUser.uid, 
                    studentName: currentUser.fullName, instructorUid: selectedInstructor.value,
                    imageB64: base64String, imageMimeType: mimeType, imageName: fileName
                };
                
                if (department === 'massage') {
                    payload.date = document.getElementById('msg_date').value;
                    payload.hn = document.getElementById('msg_hn').value;
                    payload.patientName = document.getElementById('msg_patientName').value; 
                    payload.caseType = document.getElementById('msg_caseType').value;
                    payload.diseaseCategory = document.getElementById('msg_diseaseCategory').value;
                    payload.diseaseName = document.getElementById('msg_diseaseName').value;
                } else if (department === 'midwifery') {
                    payload.date = document.getElementById('mid_date').value;
                    payload.hn = document.getElementById('mid_hn').value;
                    payload.patientName = document.getElementById('mid_patientName').value; 
                } else if (department === 'medicine') {
                    payload.date = document.getElementById('med_date').value;
                    payload.hn = document.getElementById('med_hn').value;
                    payload.patientName = document.getElementById('med_patientName').value; 
                    const medSelect = document.getElementById('med_diseaseName');
                    payload.diseaseName = medSelect.value;
                    const selectedOption = medSelect.options[medSelect.selectedIndex];
                    payload.diseaseCategory = selectedOption ? selectedOption.getAttribute('data-category') : 'โรคทั่วไป';
                    payload.caseType = 'New';
                }

                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                alert(result.message);
                if (result.success) { 
                    e.target.reset(); 
                    document.getElementById(department === 'massage' ? 'msg_date' : department === 'midwifery' ? 'mid_date' : 'med_date').valueAsDate = new Date(); 
                }
            } catch (err) { 
                alert("เกิดข้อผิดพลาด หรือไฟล์มีขนาดใหญ่เกินไปทำให้เซิร์ฟเวอร์ตัดการเชื่อมต่อ"); 
            } finally { 
                btn.innerHTML = originalText; btn.disabled = false; 
            }
        }

        // ================= ระบบ Dashboard (สำหรับอาจารย์) =================
        async function loadDashboardData() {
            if (currentUser.role !== 'instructor') return;
            const pendingContainer = document.getElementById('pending-cases-container');
            const statsContainer = document.getElementById('student-stats-container');
            const rankContainer = document.getElementById('disease-rank-container');

            pendingContainer.innerHTML = '<div class="flex flex-col items-center justify-center py-10 opacity-40"><i class="fa-solid fa-asterisk fa-spin text-4xl text-orange-400 mb-4"></i><p class="text-xs font-bold tracking-widest">LOADING...</p></div>';
            
            try {
                let pendingHtml = "";
                const deps = ['massage', 'midwifery', 'medicine'];
                
                // ใช้ตัวแปรช่วยในการหน่วงเวลาแอนิเมชัน (Staggered Animation)
                let delayCounter = 0; 

                for (let dep of deps) {
                    const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const cases = await res.json();
                    
                    for (let caseId in cases) {
                        const c = cases[caseId];
                        if (c.status === 'pending' && c.instructorUid === currentUser.uid) {
                            let icon = dep === 'massage' ? 'fa-hands-bubbles text-emerald-500 bg-emerald-100' : dep === 'midwifery' ? 'fa-person-breastfeeding text-rose-500 bg-rose-100' : 'fa-stethoscope text-blue-500 bg-blue-100';
                            
                            let imageBtn = "";
                            if (c.imageUrl && c.imageUrl !== "-") {
                                imageBtn = `<a href="${c.imageUrl}" target="_blank" class="inline-flex items-center gap-1.5 mt-3 text-[10px] font-extrabold bg-gray-900 text-white px-3 py-1.5 rounded-full hover:scale-105 transition transform shadow-md"><i class="fa-solid fa-image"></i> ดูรูปหลักฐาน</a>`;
                            }

                            pendingHtml += `
                                <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 transition-all duration-300 card-stagger" style="animation-delay: ${delayCounter * 0.1}s" id="card_${caseId}">
                                    <div class="flex justify-between items-start mb-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-12 h-12 rounded-2xl flex items-center justify-center ${icon.split(' ').slice(1).join(' ')}"><i class="fa-solid ${icon.split(' ')[0]} text-xl"></i></div>
                                            <div>
                                                <p class="text-[14px] font-extrabold text-gray-800 tracking-tight leading-none mb-1">${c.studentName}</p>
                                                <p class="text-[10px] text-gray-400 font-extrabold">HN: ${c.hn} • วันที่: ${c.date}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="bg-gray-50 p-4 rounded-[1.5rem] border border-gray-100 mb-5 relative overflow-hidden">
                                        <div class="absolute left-0 top-0 w-1 h-full bg-gradient-to-b from-orange-400 to-pink-400"></div>
                                        <p class="text-[13px] font-bold text-gray-700 ml-2">📌 ${c.diseaseName || c.treatment || 'โปรดดูรายละเอียดในกระดาษ'}</p>
                                        <div class="ml-2">${imageBtn}</div>
                                    </div>
                                    <div class="flex gap-3">
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'approved')" class="btn-glow btn-green flex-1 text-white text-[11px] font-extrabold py-2.5 flex justify-center items-center gap-1.5"><i class="fa-solid fa-check"></i> ผ่าน</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'returned')" class="btn-glow flex-1 bg-gradient-to-r from-amber-400 to-orange-400 text-white text-[11px] font-extrabold py-2.5 rounded-full shadow-lg shadow-orange-400/40 flex justify-center items-center gap-1.5"><i class="fa-solid fa-rotate-left"></i> ส่งแก้</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'rejected')" class="btn-glow flex-1 bg-gradient-to-r from-red-500 to-rose-600 text-white text-[11px] font-extrabold py-2.5 rounded-full shadow-lg shadow-red-500/40 flex justify-center items-center gap-1.5"><i class="fa-solid fa-xmark"></i> ปฏิเสธ</button>
                                    </div>
                                </div>
                            `;
                            delayCounter++;
                        }
                    }
                }
                pendingContainer.innerHTML = pendingHtml || '<div class="text-center py-10 opacity-50"><div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-mug-hot text-2xl text-gray-400"></i></div><p class="text-xs font-extrabold tracking-wide text-gray-500">ยอดเยี่ยม! ไม่มีเคสรอตรวจ</p></div>';

                // โหลดสถิตินักศึกษา
                const usersRes = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await usersRes.json();
                let statsHtml = "";
                let statDelay = 0;
                
                for (const uid in users) {
                    if (users[uid].role === 'student' && users[uid].isActive) {
                        const st = users[uid].stats || {};
                        const msgTotal = (st.massage_new || 0) + (st.massage_followup || 0);
                        const midTotal = (st.midwifery || 0);
                        const medTotal = (st.medicine_general || 0) + (st.medicine_ncd || 0);

                        statsHtml += `
                            <div class="bg-white p-5 rounded-[2rem] shadow-sm border border-gray-100 card-stagger" style="animation-delay: ${statDelay * 0.1}s">
                                <div class="flex items-center gap-3 mb-5">
                                    <div class="p-1 rounded-full bg-gradient-to-tr from-indigo-400 to-purple-400">
                                        <img src="${users[uid].picUrl}" class="w-10 h-10 rounded-full border-2 border-white object-cover">
                                    </div>
                                    <p class="text-[14px] font-extrabold text-gray-800 tracking-tight">${users[uid].fullName}</p>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2 font-extrabold"><span>นวดไทย (60)</span><span class="text-emerald-500">${msgTotal}/60</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner"><div class="bg-gradient-to-r from-emerald-400 to-teal-500 h-2.5 rounded-full shadow-md" style="width: ${Math.min((msgTotal/60)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2 font-extrabold"><span>ผดุงครรภ์ (10)</span><span class="text-rose-500">${midTotal}/10</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner"><div class="bg-gradient-to-r from-rose-400 to-pink-500 h-2.5 rounded-full shadow-md" style="width: ${Math.min((midTotal/10)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-400 uppercase tracking-widest mb-2 font-extrabold"><span>เวชกรรม (20)</span><span class="text-blue-500">${medTotal}/20</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2.5 shadow-inner"><div class="bg-gradient-to-r from-blue-400 to-indigo-500 h-2.5 rounded-full shadow-md" style="width: ${Math.min((medTotal/20)*100, 100)}%"></div></div>
                                    </div>
                                </div>
                            </div>
                        `;
                        statDelay++;
                    }
                }
                statsContainer.innerHTML = statsHtml || '<p class="text-[11px] text-center text-gray-400 py-4 font-bold">ยังไม่มีข้อมูลนักศึกษาในระบบ</p>';

                // โหลด RANK
                let diseaseCount = {};
                for (let dep of ['massage', 'medicine']) {
                    const caseRes = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const allCases = await caseRes.json();
                    for (let cid in allCases) {
                        if (allCases[cid].status === 'approved' && allCases[cid].diseaseName) {
                            const dName = allCases[cid].diseaseName;
                            diseaseCount[dName] = (diseaseCount[dName] || 0) + 1;
                        }
                    }
                }

                const sortedRank = Object.entries(diseaseCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
                if (sortedRank.length > 0) {
                    let rankHtml = '<ul class="space-y-4">';
                    sortedRank.forEach((item, index) => {
                        let medal = index === 0 ? '<span class="text-2xl drop-shadow-md">🥇</span>' : index === 1 ? '<span class="text-2xl drop-shadow-md">🥈</span>' : index === 2 ? '<span class="text-2xl drop-shadow-md">🥉</span>' : `<span class="w-7 h-7 flex items-center justify-center bg-gray-100 rounded-full text-[11px] font-extrabold text-gray-400 shadow-inner">${index+1}</span>`;
                        rankHtml += `
                            <li class="flex justify-between items-center text-[13px] border-b border-gray-100/50 pb-4 last:border-0 last:pb-0 card-stagger" style="animation-delay: ${index * 0.1}s">
                                <div class="flex items-center gap-4 truncate w-3/4">${medal}<span class="truncate font-extrabold text-gray-700">${item[0]}</span></div>
                                <span class="font-extrabold text-teal-600 bg-teal-50 px-3 py-1.5 rounded-xl border border-teal-100">${item[1]}</span>
                            </li>
                        `;
                    });
                    rankContainer.innerHTML = rankHtml + '</ul>';
                } else {
                    rankContainer.innerHTML = '<p class="text-[11px] text-center text-gray-400 py-4 font-bold">ยังไม่มีข้อมูลเคสที่อนุมัติ</p>';
                }

            } catch(e) { pendingContainer.innerHTML = '<p class="text-center text-sm text-red-400 py-4 font-bold">ดึงข้อมูลล้มเหลว กรุณาลองใหม่</p>'; }
        }

        async function judgeCase(department, caseId, status) {
            let remark = "";
            if (status !== 'approved') {
                remark = prompt("กรุณาระบุหมายเหตุ (สาเหตุที่ส่งคืน หรือ ยกเลิก):");
                if (remark === null) return; 
            }

            const card = document.getElementById(`card_${caseId}`);
            card.style.opacity = '0.3';
            card.style.transform = 'scale(0.95)';
            try {
                const payload = { action: "updateCaseStatus", department: department, caseId: caseId, status: status, remark: remark, instructorUid: currentUser.uid };
                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if (result.success) {
                    card.remove();
                    if (status === 'approved') loadDashboardData(); 
                } else { alert(result.message); card.style.opacity = '1'; card.style.transform = 'scale(1)'; }
            } catch (err) { alert("Error"); card.style.opacity = '1'; card.style.transform = 'scale(1)'; }
        }
    </script>
