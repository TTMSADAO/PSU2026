<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกเคส - รพ.สะเดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #f4f7f6; 
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* Background Animated Blobs */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* UI Elements */
        .glass-card { 
            background: rgba(255, 255, 255, 0.75); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08); 
        }

        .input-modern {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(249, 250, 251, 0.8);
        }
        .input-modern:focus {
            transform: translateY(-2px);
            background-color: #ffffff;
            box-shadow: 0 8px 20px -6px rgba(34, 197, 94, 0.15);
        }

        .bottom-nav { box-shadow: 0 -10px 30px rgba(0,0,0,0.05); }
        .nav-item { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .nav-item.active { transform: translateY(-4px); }
        
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(30px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-tab { animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .instructor-radio:checked + label {
            border-color: #22c55e;
            background-color: #f0fdf4;
            transform: translateY(-3px);
            box-shadow: 0 8px 15px -3px rgba(34, 197, 94, 0.2);
        }
        .instructor-radio:checked + label img {
            border: 2px solid #22c55e;
            transform: scale(1.05);
        }
        .instructor-radio:checked + label .check-icon { transform: scale(1); opacity: 1; }
        .check-icon { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0); opacity: 0; }
        .btn-bouncy { transition: transform 0.2s; }
        .btn-bouncy:active { transform: scale(0.95); }
    </style>
</head>
<body class="pb-28">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-5%] left-[-10%] w-72 h-72 bg-green-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob"></div>
        <div class="absolute top-[15%] right-[-10%] w-72 h-72 bg-emerald-200 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-2000"></div>
        <div class="absolute bottom-[20%] left-[10%] w-72 h-72 bg-teal-100 rounded-full mix-blend-multiply filter blur-3xl opacity-40 animate-blob animation-delay-4000"></div>

    <div class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between mb-6 border-b border-white/50">

       <div id="form-dashboard" class="hidden glass-card p-6 rounded-[2rem] mb-6">

    <script>
        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';
        const FIREBASE_SECRET = '9iKYKSmC8ssrUXvEdh2OOqS4JCeyEwcaCGr83WkG';
        const LIFF_ID = "2010280091-6e8mWiGV";
        
        // ⚠️ นำ URL จาก Apps Script มาวางที่นี่
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxFeZxtiaQ_TgT6Hzd0bDo19rbM8SjmGVMMid9BQanch9pyEtOB2ivlXtF6tB9xQGuKKQ/exec";

        let currentUser = null; 
        let instructorList = [];

        window.onload = async () => {
            const today = new Date();
            document.getElementById('msg_date').valueAsDate = today;
            document.getElementById('mid_date').valueAsDate = today;
            document.getElementById('med_date').valueAsDate = today;

            await loadDropdownConfigs();
            await fetchUsersAndRenderInstructors(); 
            await initializeLiff();
        };

        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`);
                const configs = await res.json();
                
                if (configs?.diseases_massage) {
                    const msgSelect = document.getElementById('msg_diseaseName');
                    msgSelect.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(configs.diseases_massage)) {
                        msgSelect.innerHTML += `<option value="${name}">${code}: ${name}</option>`;
                    }
                }
                if (configs?.diseases_medicine) {
                    const medSelect = document.getElementById('med_diseaseName');
                    medSelect.innerHTML = '<option value="">-- เลือกการวินิจฉัย --</option>';
                    for (const [code, obj] of Object.entries(configs.diseases_medicine)) {
                        medSelect.innerHTML += `<option value="${obj.name}" data-category="${obj.type}">${code}: ${obj.name}</option>`;
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function fetchUsersAndRenderInstructors() {
            try {
                const res = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await res.json();
                for (const uid in users) {
                    if (users[uid].role === 'instructor' && users[uid].isActive) {
                        instructorList.push({ uid: uid, name: users[uid].fullName, picUrl: users[uid].picUrl });
                    }
                }
                ['massage', 'midwifery', 'medicine'].forEach(dep => {
                    const container = document.getElementById(`instructors_${dep}`);
                    if(container){
                        container.innerHTML = instructorList.map((inst, index) => `
                            <div class="relative">
                                <input type="radio" name="instructor_${dep}" id="inst_${dep}_${index}" value="${inst.uid}" class="instructor-radio hidden" required>
                                <label for="inst_${dep}_${index}" class="cursor-pointer border-2 border-transparent bg-white rounded-[1.25rem] p-2 flex flex-col items-center gap-1.5 transition-all duration-300 relative instructor-label shadow-sm">
                                    <img src="${inst.picUrl}" class="w-11 h-11 rounded-full object-cover shadow-sm transition-all duration-300">
                                    <span class="text-[10px] font-bold text-gray-700 text-center truncate w-full">${inst.name.split(' ')[0]}</span>
                                    <div class="check-icon absolute -top-2 -right-2 bg-green-500 text-white w-5 h-5 rounded-full flex items-center justify-center shadow-md"><i class="fa-solid fa-check text-[10px]"></i></div>
                                </label>
                            </div>
                        `).join('');
                    }
                });
            } catch (e) { console.error(e); }
        }

        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    checkUserPermission(await liff.getProfile());
                } else { liff.login(); }
            } catch (err) { 
                console.error("LIFF Init Error: ", err);
                document.getElementById('userName').innerText = "LIFF Error";
                document.getElementById('userRole').innerText = "ตรวจสอบตั้งค่า";
                document.getElementById('userRole').className = "text-[9px] text-red-600 bg-red-100 px-2 py-0.5 rounded-full inline-block font-bold mt-1";
            }
        }

        async function checkUserPermission(profile) {
            try {
                const res = await fetch(`${FIREBASE_URL}users/${profile.userId}.json?auth=${FIREBASE_SECRET}`);
                const userData = await res.json();
                
                const firstName = profile.displayName.split(' ')[0];
                document.getElementById('userName').innerText = userData && userData.isActive ? firstName : profile.displayName;
                document.getElementById('userImg').src = profile.pictureUrl;
                
                const roleBadge = document.getElementById('userRole');
                if (userData && userData.isActive) {
                    currentUser = { uid: profile.userId, ...userData };
                    if (userData.role === 'instructor') {
                        roleBadge.innerText = "⭐ อาจารย์"; 
                        roleBadge.className = "text-[9px] text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full font-bold mt-1 inline-block";
                        document.getElementById('nav-dashboard').classList.remove('hidden'); 
                    } else {
                        roleBadge.innerText = "🎓 นักศึกษา"; 
                        roleBadge.className = "text-[9px] text-green-600 bg-green-100 px-2 py-0.5 rounded-full font-bold mt-1 inline-block";
                    }
                } else {
                    document.getElementById('userName').innerText = "ไม่มีสิทธิ์";
                    roleBadge.innerText = "Unregistered";
                }
            } catch (e) { console.error(e); }
        }

        function switchTab(tabId) {
            const tabs = ['massage', 'midwifery', 'medicine', 'dashboard'];
            
            tabs.forEach(id => {
                const form = document.getElementById(`form-${id}`);
                const nav = document.getElementById(`nav-${id}`);
                
                form.classList.add('hidden');
                form.classList.remove('animate-tab');
                
                if(nav) {
                    nav.classList.remove('active', 'text-green-600', 'text-pink-600', 'text-blue-600', 'text-orange-600');
                    if(id !== 'dashboard') nav.classList.add('text-gray-400');
                    const wrapper = nav.querySelector('.icon-wrapper');
                    wrapper.classList.remove('bg-green-100', 'bg-pink-100', 'bg-blue-100', 'bg-orange-100');
                }
            });

            const activeForm = document.getElementById(`form-${tabId}`);
            const activeNav = document.getElementById(`nav-${tabId}`);
            
            activeForm.classList.remove('hidden');
            void activeForm.offsetWidth; 
            activeForm.classList.add('animate-tab');

            if(activeNav) {
                activeNav.classList.remove('text-gray-400');
                activeNav.classList.add('active');
                const wrapper = activeNav.querySelector('.icon-wrapper');
                
                if(tabId === 'massage') { activeNav.classList.add('text-green-600'); wrapper.classList.add('bg-green-100'); }
                else if(tabId === 'midwifery') { activeNav.classList.add('text-pink-600'); wrapper.classList.add('bg-pink-100'); }
                else if(tabId === 'medicine') { activeNav.classList.add('text-blue-600'); wrapper.classList.add('bg-blue-100'); }
                else if(tabId === 'dashboard') { activeNav.classList.add('text-orange-600'); wrapper.classList.add('bg-orange-100'); }
            }
        }

        // ================= ฟังก์ชันกดส่งเคส & แปลงรูปภาพ =================
        async function submitForm(e, department) {
            e.preventDefault();
            if (!currentUser) return alert("รอระบบโหลดข้อมูลสักครู่ครับ");
            const selectedInstructor = document.querySelector(`input[name="instructor_${department}"]:checked`);
            if (!selectedInstructor) return alert("กรุณาเลือกอาจารย์ผู้ตรวจก่อนส่งครับ");

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด...`; 
            btn.disabled = true;

            try {
                let base64String = "";
                let mimeType = "";
                let fileName = "";
                
                const fileInput = document.getElementById(`${department === 'massage' ? 'msg' : department === 'midwifery' ? 'mid' : 'med'}_image`);
                
                if (fileInput && fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    if (file.size > 5 * 1024 * 1024) {
                        alert("⚠️ ไฟล์รูปภาพใหญ่เกินไป กรุณาเลือกไฟล์ที่ขนาดไม่เกิน 5MB ครับ");
                        btn.innerHTML = originalText; btn.disabled = false;
                        return;
                    }
                    fileName = department + "_" + Date.now() + "_" + file.name;
                    mimeType = file.type;
                    
                    base64String = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result.split(',')[1]); 
                        reader.onerror = error => reject(error);
                        reader.readAsDataURL(file);
                    });
                }

                let payload = { 
                    action: "submitNewCase", 
                    department: department, 
                    studentUid: currentUser.uid, 
                    studentName: currentUser.fullName, 
                    instructorUid: selectedInstructor.value,
                    imageB64: base64String,
                    imageMimeType: mimeType,
                    imageName: fileName
                };
                
                if (department === 'massage') {
                    payload.date = document.getElementById('msg_date').value;
                    payload.hn = document.getElementById('msg_hn').value;
                    payload.patientName = document.getElementById('msg_patientName').value; 
                    payload.caseType = document.getElementById('msg_caseType').value;
                    payload.diseaseCategory = document.getElementById('msg_diseaseCategory').value;
                    payload.diseaseName = document.getElementById('msg_diseaseName').value;
                } else if (department === 'midwifery') {
                    payload.date = document.getElementById('mid_date').value;
                    payload.hn = document.getElementById('mid_hn').value;
                    payload.patientName = document.getElementById('mid_patientName').value; 
                } else if (department === 'medicine') {
                    payload.date = document.getElementById('med_date').value;
                    payload.hn = document.getElementById('med_hn').value;
                    payload.patientName = document.getElementById('med_patientName').value; 
                    const medSelect = document.getElementById('med_diseaseName');
                    payload.diseaseName = medSelect.value;
                    const selectedOption = medSelect.options[medSelect.selectedIndex];
                    payload.diseaseCategory = selectedOption ? selectedOption.getAttribute('data-category') : 'โรคทั่วไป';
                    payload.caseType = 'New';
                }

                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                alert(result.message);
                if (result.success) { 
                    e.target.reset(); 
                    document.getElementById(department === 'massage' ? 'msg_date' : department === 'midwifery' ? 'mid_date' : 'med_date').valueAsDate = new Date(); 
                }
            } catch (err) { 
                console.error(err); 
                alert("เกิดข้อผิดพลาด หรือไฟล์มีขนาดใหญ่เกินไปทำให้เซิร์ฟเวอร์ตัดการเชื่อมต่อ"); 
            } finally { 
                btn.innerHTML = originalText; 
                btn.disabled = false; 
            }
        }

        // ================= ระบบ Dashboard (สำหรับอาจารย์) =================
        async function loadDashboardData() {
            if (currentUser.role !== 'instructor') return;
            const pendingContainer = document.getElementById('pending-cases-container');
            const statsContainer = document.getElementById('student-stats-container');
            const rankContainer = document.getElementById('disease-rank-container');

            pendingContainer.innerHTML = '<div class="flex flex-col items-center justify-center py-8 opacity-50"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-orange-400 mb-3"></i><p class="text-xs text-gray-500">กำลังดึงข้อมูลเคส...</p></div>';
            
            try {
                let pendingHtml = "";
                const deps = ['massage', 'midwifery', 'medicine'];
                for (let dep of deps) {
                    const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const cases = await res.json();
                    
                    for (let caseId in cases) {
                        const c = cases[caseId];
                        if (c.status === 'pending' && c.instructorUid === currentUser.uid) {
                            let icon = dep === 'massage' ? 'fa-hands-bubbles text-green-500 bg-green-100' : dep === 'midwifery' ? 'fa-person-breastfeeding text-pink-500 bg-pink-100' : 'fa-stethoscope text-blue-500 bg-blue-100';
                            
                            // โชว์ปุ่มดูรูปลายเซ็น (ถ้ามี)
                            let imageBtn = "";
                            if (c.imageUrl && c.imageUrl !== "-") {
                                imageBtn = `<a href="${c.imageUrl}" target="_blank" class="inline-block mt-2 text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-lg border border-blue-100 hover:bg-blue-100 transition"><i class="fa-solid fa-image"></i> ดูรูปหลักฐาน</a>`;
                            }

                            pendingHtml += `
                                <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-gray-100 transition-all duration-300" id="card_${caseId}">
                                    <div class="flex justify-between items-start mb-3">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full flex items-center justify-center ${icon.split(' ').slice(1).join(' ')}"><i class="fa-solid ${icon.split(' ')[0]} text-lg"></i></div>
                                            <div>
                                                <p class="text-[13px] font-extrabold text-gray-800">${c.studentName}</p>
                                                <p class="text-[10px] text-gray-500 font-medium">HN: ${c.hn} • วันที่: ${c.date}</p>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="bg-gray-50 p-3 rounded-xl border border-gray-100 mb-4">
                                        <p class="text-[12px] font-bold text-gray-700">📌 ${c.diseaseName || c.treatment || 'โปรดดูรายละเอียดในกระดาษ'}</p>
                                        ${imageBtn}
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'approved')" class="btn-bouncy flex-1 bg-green-500 text-white text-[11px] font-bold py-2 rounded-xl shadow-md shadow-green-500/20 hover:bg-green-600 transition"><i class="fa-solid fa-check mr-1"></i> ผ่าน</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'returned')" class="btn-bouncy flex-1 bg-yellow-400 text-white text-[11px] font-bold py-2 rounded-xl shadow-md shadow-yellow-400/20 hover:bg-yellow-500 transition"><i class="fa-solid fa-rotate-left mr-1"></i> ส่งแก้</button>
                                        <button onclick="judgeCase('${dep}', '${caseId}', 'rejected')" class="btn-bouncy flex-1 bg-red-500 text-white text-[11px] font-bold py-2 rounded-xl shadow-md shadow-red-500/20 hover:bg-red-600 transition"><i class="fa-solid fa-xmark mr-1"></i> ปฏิเสธ</button>
                                    </div>
                                </div>
                            `;
                        }
                    }
                }
                pendingContainer.innerHTML = pendingHtml || '<div class="text-center py-8 opacity-40"><i class="fa-solid fa-face-laugh-beam text-4xl text-gray-400 mb-3"></i><p class="text-xs font-bold text-gray-500">ยอดเยี่ยม! ไม่มีเคสรอตรวจ</p></div>';

                // โหลดสถิตินักศึกษา
                const usersRes = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await usersRes.json();
                let statsHtml = "";
                
                for (const uid in users) {
                    if (users[uid].role === 'student' && users[uid].isActive) {
                        const st = users[uid].stats || {};
                        const msgTotal = (st.massage_new || 0) + (st.massage_followup || 0);
                        const midTotal = (st.midwifery || 0);
                        const medTotal = (st.medicine_general || 0) + (st.medicine_ncd || 0);

                        statsHtml += `
                            <div class="bg-white p-4 rounded-[1.5rem] shadow-sm border border-gray-100">
                                <div class="flex items-center gap-3 mb-4">
                                    <img src="${users[uid].picUrl}" class="w-10 h-10 rounded-full border-2 border-indigo-100 object-cover">
                                    <p class="text-[13px] font-extrabold text-gray-800">${users[uid].fullName}</p>
                                </div>
                                <div class="space-y-4">
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-500 mb-1.5 font-bold"><span>นวดไทย (60)</span><span class="text-green-600">${msgTotal}/60</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-gradient-to-r from-green-400 to-emerald-500 h-2 rounded-full shadow-sm" style="width: ${Math.min((msgTotal/60)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-500 mb-1.5 font-bold"><span>ผดุงครรภ์ (10)</span><span class="text-pink-600">${midTotal}/10</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-gradient-to-r from-pink-400 to-rose-500 h-2 rounded-full shadow-sm" style="width: ${Math.min((midTotal/10)*100, 100)}%"></div></div>
                                    </div>
                                    <div>
                                        <div class="flex justify-between text-[10px] text-gray-500 mb-1.5 font-bold"><span>เวชกรรม (20)</span><span class="text-blue-600">${medTotal}/20</span></div>
                                        <div class="w-full bg-gray-100 rounded-full h-2"><div class="bg-gradient-to-r from-blue-400 to-indigo-500 h-2 rounded-full shadow-sm" style="width: ${Math.min((medTotal/20)*100, 100)}%"></div></div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }
                statsContainer.innerHTML = statsHtml || '<p class="text-[11px] text-center text-gray-400 py-4">ยังไม่มีข้อมูลนักศึกษาในระบบ</p>';

                // โหลด RANK
                let diseaseCount = {};
                for (let dep of ['massage', 'medicine']) {
                    const caseRes = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`);
                    const allCases = await caseRes.json();
                    for (let cid in allCases) {
                        if (allCases[cid].status === 'approved' && allCases[cid].diseaseName) {
                            const dName = allCases[cid].diseaseName;
                            diseaseCount[dName] = (diseaseCount[dName] || 0) + 1;
                        }
                    }
                }

                const sortedRank = Object.entries(diseaseCount).sort((a, b) => b[1] - a[1]).slice(0, 10);
                if (sortedRank.length > 0) {
                    let rankHtml = '<ul class="space-y-3">';
                    sortedRank.forEach((item, index) => {
                        let medal = index === 0 ? '<span class="text-xl">🥇</span>' : index === 1 ? '<span class="text-xl">🥈</span>' : index === 2 ? '<span class="text-xl">🥉</span>' : `<span class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded-full text-[10px] font-extrabold text-gray-500">${index+1}</span>`;
                        rankHtml += `
                            <li class="flex justify-between items-center text-[12px] border-b border-gray-50 pb-3 last:border-0 last:pb-0">
                                <div class="flex items-center gap-3 truncate w-3/4">${medal}<span class="truncate font-bold text-gray-700">${item[0]}</span></div>
                                <span class="font-extrabold text-teal-700 bg-teal-50 px-3 py-1 rounded-lg">${item[1]}</span>
                            </li>
                        `;
                    });
                    rankContainer.innerHTML = rankHtml + '</ul>';
                } else {
                    rankContainer.innerHTML = '<p class="text-[11px] text-center text-gray-400 py-4">ยังไม่มีข้อมูลเคสที่อนุมัติ</p>';
                }

            } catch(e) { pendingContainer.innerHTML = '<p class="text-center text-sm text-red-400 py-4">ดึงข้อมูลล้มเหลว กรุณาลองใหม่</p>'; }
        }

        async function judgeCase(department, caseId, status) {
            let remark = "";
            if (status !== 'approved') {
                remark = prompt("กรุณาระบุหมายเหตุ (สาเหตุที่ส่งคืน หรือ ยกเลิก):");
                if (remark === null) return; 
            }

            document.getElementById(`card_${caseId}`).style.opacity = '0.4';
            document.getElementById(`card_${caseId}`).style.transform = 'scale(0.98)';
            try {
                const payload = { action: "updateCaseStatus", department: department, caseId: caseId, status: status, remark: remark, instructorUid: currentUser.uid };
                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if (result.success) {
                    document.getElementById(`card_${caseId}`).remove();
                    if (status === 'approved') loadDashboardData(); 
                } else { alert(result.message); document.getElementById(`card_${caseId}`).style.opacity = '1'; }
            } catch (err) { alert("Error"); document.getElementById(`card_${caseId}`).style.opacity = '1'; }
        }
    </script>
