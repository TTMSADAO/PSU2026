<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TTMED STUDY - รพ.สะเดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        :root { --app-bg: #eefdf6; --glass-bg: rgba(255, 255, 255, 0.85); }
        body { 
            font-family: 'Prompt', sans-serif; background-color: var(--app-bg);
            background-image: 
                radial-gradient(at 10% 10%, hsla(153, 100%, 80%, 0.5) 0px, transparent 50%), 
                radial-gradient(at 90% 10%, hsla(199, 100%, 80%, 0.5) 0px, transparent 50%), 
                radial-gradient(at 50% 90%, hsla(43, 100%, 82%, 0.5) 0px, transparent 50%);
            background-attachment: fixed; min-height: 100vh; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
            color: #0f172a; 
        }

        .glass-card { 
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 1); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08); border-radius: 2rem; 
        }
        
        .sub-nav { display: flex; background: rgba(255,255,255,0.8); padding: 6px; border-radius: 999px; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 24px;}
        .sub-nav-btn { flex: 1; text-align: center; font-size: 12px; font-weight: 800; padding: 12px 0; border-radius: 999px; color: #64748b; transition: all 0.3s; }
        .sub-nav-btn.active { background: white; color: #059669; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transform: scale(1.02); }
        .sub-nav-btn.active-mid { color: #e11d48; } .sub-nav-btn.active-med { color: #2563eb; }

        .filter-pill { padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #475569; background: white; border: 1.5px solid #cbd5e1; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; cursor: pointer;}
        .filter-pill.active-pending { background: #fffbeb; color: #b45309; border-color: #fbbf24; box-shadow: 0 6px 12px -2px rgba(245,158,11,0.25); transform: translateY(-3px);}
        .filter-pill.active-approved { background: #ecfdf5; color: #047857; border-color: #34d399; box-shadow: 0 6px 12px -2px rgba(16,185,129,0.25); transform: translateY(-3px);}
        .filter-pill.active-returned { background: #fef2f2; color: #be123c; border-color: #fb7185; box-shadow: 0 6px 12px -2px rgba(225,29,72,0.25); transform: translateY(-3px);}
        .filter-pill.active-std { background: linear-gradient(135deg, #e0e7ff, #c7d2fe); color: #3730a3; border-color: #818cf8; box-shadow: 0 6px 12px -2px rgba(79, 70, 229, 0.25); transform: translateY(-3px);}

        .input-wow { background-color: rgba(255, 255, 255, 0.95); border: 2px solid #e2e8f0; transition: all 0.3s; border-radius: 1.25rem; font-weight: 600; color: #1e293b;}
        .input-wow:focus { transform: translateY(-2px); border-color: #10b981; box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15); outline: none; }
        
        .floating-nav { bottom: 20px; width: calc(100% - 32px); left: 16px; border-radius: 999px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 20px 50px rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,1); border: 1px solid #f1f5f9; }
        .nav-item { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); } .nav-item.active { transform: translateY(-6px); color: #059669; }
        .nav-item .icon-box { transition: all 0.3s ease; } .nav-item.active .icon-box { transform: scale(1.2); }
        
        .btn-glow { transition: all 0.2s; border-radius: 999px; position: relative; overflow: hidden; }
        .btn-glow:active { transform: scale(0.95); }
        .btn-primary { background: linear-gradient(135deg, #059669, #047857); box-shadow: 0 8px 25px -5px rgba(5, 150, 105, 0.5); color: white;}
        .btn-outline { background: white; border: 2.5px solid #059669; color: #059669; }

        .instructor-radio:checked + label { background-color: #ffffff; transform: translateY(-4px) scale(1.03); box-shadow: 0 12px 25px -5px rgba(0,0,0,0.15); border-color: #34d399;}
        .instructor-radio:checked + label .avatar-ring { background: linear-gradient(45deg, #10b981, #059669); padding: 4px; }
        .instructor-radio:checked + label .check-icon { transform: scale(1); opacity: 1; }
        .check-icon { transition: all 0.3s; transform: scale(0); opacity: 0; }
        .avatar-ring { transition: all 0.3s; padding: 0px; border-radius: 50%; }
        
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        .animate-tab { animation: slideUp 0.4s ease forwards; }
        
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.5px;}
        .badge-draft { background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; }
        .badge-pending { background: #fef3c7; color: #b45309; border: 1px solid #fcd34d; }
        .badge-returned { background: #ffe4e6; color: #be123c; border: 1px solid #fda4af; }
        .badge-approved { background: #d1fae5; color: #047857; border: 1px solid #6ee7b7; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        div:where(.swal2-container) div:where(.swal2-popup) { border-radius: 1.5rem !important; font-family: 'Prompt', sans-serif !important; }
    </style>
</head>
<body class="pb-32">

    <div class="sticky top-0 z-40 px-4 py-4 flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
            <div class="w-14 h-14 bg-white rounded-[1.2rem] shadow-md border border-gray-100 flex items-center justify-center overflow-hidden p-2 transform hover:scale-105 transition">
                <img src="https://github.com/TTMSADAO/ttmed-sadao-queue/blob/PIC/%E0%B9%82%E0%B8%A5%E0%B9%82%E0%B8%81%E0%B9%89%E0%B9%81%E0%B8%9C%E0%B8%99%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%B8%E0%B9%88%E0%B8%99%E0%B8%A1%E0%B8%AB%E0%B8%B2%E0%B9%80%E0%B8%AA%E0%B8%99%E0%B9%88%E0%B8%AB%E0%B9%8C.png?raw=true" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-[18px] font-extrabold text-slate-900 leading-none mb-1 tracking-tight">TTMED <span class="text-emerald-600">STUDY</span></h1>
                <p class="text-[10px] font-extrabold text-slate-500 uppercase tracking-widest">Sadao Hospital</p>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-white/90 backdrop-blur-md p-1.5 rounded-full shadow-md border border-white">
            <div class="text-right pl-3 hidden sm:block">
                <p id="userName" class="text-[13px] font-extrabold text-slate-900">กำลังโหลด...</p>
                <div id="userRoleContainer"></div>
            </div>
            <img id="userImg" src="https://ui-avatars.com/api/?name=U" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        <div id="edit-banner" class="hidden bg-amber-100 border border-amber-300 text-amber-900 px-5 py-3 rounded-2xl mb-5 flex justify-between items-center text-[13px] font-extrabold animate-tab shadow-sm">
            <span class="flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-amber-600 text-lg"></i> โหมดแก้ไขเคส (Draft / ส่งแก้)</span>
            <button onclick="cancelEdit()" class="text-amber-600 hover:text-red-600 bg-amber-200/50 w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div id="view-forms" class="hidden animate-tab">
            <div class="sub-nav">
                <button onclick="switchForm('massage')" id="sub-massage" class="sub-nav-btn active">🌿 นวดไทย</button>
                <button onclick="switchForm('midwifery')" id="sub-midwifery" class="sub-nav-btn">🤱 ผดุงครรภ์</button>
                <button onclick="switchForm('medicine')" id="sub-medicine" class="sub-nav-btn">🩺 เวชกรรม</button>
            </div>

            <div id="form-massage" class="glass-card p-6 block">
                <form onsubmit="event.preventDefault();" id="formObj-massage" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📅 วันที่</label><input type="date" id="msg_date" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">🆔 รหัส HN</label><input type="text" id="msg_hn" placeholder="ระบุ HN" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    </div>
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">👤 ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="msg_patientName" placeholder="ระบุชื่อและนามสกุล" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    
                    <div class="p-5 bg-white/60 rounded-[1.5rem] border border-white shadow-sm space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">รูปแบบ</label><select id="msg_caseType" class="input-wow w-full text-[13px] px-3 py-3.5 cursor-pointer"><option value="New">✨ เคสใหม่</option><option value="FollowUp">🔄 ติดตามผล</option></select></div>
                            <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">กลุ่มโรค</label><select id="msg_diseaseCategory" class="input-wow w-full text-[13px] px-3 py-3.5 cursor-pointer"><option value="โรคทางหัตถเวชกรรมไทย">หัตถเวชกรรม</option><option value="กลุ่มโรคไม่ติดต่อเรื้อรัง (NCDs)">NCDs</option></select></div>
                        </div>
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">ชื่อโรค / อาการ</label><select id="msg_diseaseName" required class="input-wow w-full text-[14px] px-3 py-3.5 cursor-pointer"><option value="">-- โหลดข้อมูล... --</option></select></div>
                    </div>
                    
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📸 แนบรูปหลักฐาน (ถ้ามี)</label><input type="file" id="msg_image" accept="image/*" class="w-full text-[13px] text-slate-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-[12px] file:font-extrabold file:bg-emerald-100 file:text-emerald-800 hover:file:bg-emerald-200 transition cursor-pointer input-wow py-1.5 px-1.5"></div>
                    
                    <div class="pt-2">
                        <label class="block text-[12px] font-extrabold text-slate-800 uppercase ml-2 mb-3 text-center tracking-wide">👨‍🏫 เลือกอาจารย์ผู้ตรวจ</label>
                        <div id="instructors_massage" class="grid grid-cols-3 gap-3"></div>
                    </div>
                    
                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="submitCaseAction('massage', true)" class="btn-glow btn-outline flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk text-lg"></i> บันทึกร่าง</button>
                        <button type="button" onclick="submitCaseAction('massage', false)" class="btn-glow btn-primary flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2"><i class="fa-solid fa-paper-plane text-lg"></i> ส่งตรวจทันที</button>
                    </div>
                </form>
            </div>

            <div id="form-midwifery" class="glass-card p-6 hidden">
                <form onsubmit="event.preventDefault();" id="formObj-midwifery" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📅 วันที่</label><input type="date" id="mid_date" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">🆔 HN มารดา</label><input type="text" id="mid_hn" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    </div>
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">👤 ชื่อ-สกุล มารดา</label><input type="text" id="mid_patientName" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📸 แนบรูปหลักฐาน (ถ้ามี)</label><input type="file" id="mid_image" accept="image/*" class="w-full text-[13px] text-slate-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-[12px] file:font-extrabold file:bg-rose-100 file:text-rose-800 hover:file:bg-rose-200 transition cursor-pointer input-wow py-1.5 px-1.5"></div>
                    <div class="pt-2"><label class="block text-[12px] font-extrabold text-slate-800 uppercase ml-2 mb-3 text-center tracking-wide">👨‍🏫 เลือกอาจารย์ผู้ตรวจ</label><div id="instructors_midwifery" class="grid grid-cols-3 gap-3"></div></div>
                    
                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="submitCaseAction('midwifery', true)" class="btn-glow bg-white border-[2.5px] border-rose-600 text-rose-600 flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk text-lg"></i> บันทึกร่าง</button>
                        <button type="button" onclick="submitCaseAction('midwifery', false)" class="btn-glow bg-gradient-to-r from-rose-600 to-pink-700 text-white flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2 shadow-lg shadow-rose-600/30"><i class="fa-solid fa-paper-plane text-lg"></i> ส่งตรวจทันที</button>
                    </div>
                </form>
            </div>

            <div id="form-medicine" class="glass-card p-6 hidden">
                <form onsubmit="event.preventDefault();" id="formObj-medicine" class="space-y-5">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📅 วันที่</label><input type="date" id="med_date" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                        <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">🆔 รหัส HN</label><input type="text" id="med_hn" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    </div>
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">👤 ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="med_patientName" required class="input-wow w-full text-[14px] px-4 py-3.5"></div>
                    <div class="p-5 bg-white/60 rounded-[1.5rem] border border-white shadow-sm"><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">วินิจฉัยโรคแผนไทย</label><select id="med_diseaseName" required class="input-wow w-full text-[14px] px-3 py-3.5 cursor-pointer"><option value="">-- โหลดข้อมูล... --</option></select></div>
                    <div><label class="block text-[11px] font-extrabold text-slate-700 uppercase ml-2 mb-1.5 tracking-wide">📸 แนบรูปหลักฐาน (ถ้ามี)</label><input type="file" id="med_image" accept="image/*" class="w-full text-[13px] text-slate-600 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-[12px] file:font-extrabold file:bg-blue-100 file:text-blue-800 hover:file:bg-blue-200 transition cursor-pointer input-wow py-1.5 px-1.5"></div>
                    <div class="pt-2"><label class="block text-[12px] font-extrabold text-slate-800 uppercase ml-2 mb-3 text-center tracking-wide">👨‍🏫 เลือกอาจารย์ผู้ตรวจ</label><div id="instructors_medicine" class="grid grid-cols-3 gap-3"></div></div>
                    
                    <div class="flex gap-3 pt-4">
                        <button type="button" onclick="submitCaseAction('medicine', true)" class="btn-glow bg-white border-[2.5px] border-blue-600 text-blue-600 flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2"><i class="fa-solid fa-floppy-disk text-lg"></i> บันทึกร่าง</button>
                        <button type="button" onclick="submitCaseAction('medicine', false)" class="btn-glow bg-gradient-to-r from-blue-600 to-indigo-700 text-white flex-1 text-[13px] font-extrabold py-4 rounded-full flex justify-center items-center gap-2 shadow-lg shadow-blue-600/30"><i class="fa-solid fa-paper-plane text-lg"></i> ส่งตรวจทันที</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="view-mycases" class="hidden glass-card p-6 mb-6">
            <h2 class="font-extrabold text-slate-900 text-[18px] mb-5 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600"><i class="fa-solid fa-folder-open"></i></div> เคสของฉัน</h2>
            <div id="mycases-container" class="space-y-4"><p class="text-center text-[13px] font-bold text-slate-500 py-10"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> กำลังโหลดข้อมูล...</p></div>
        </div>

        <div id="view-feed" class="hidden glass-card p-6 mb-6">
            <h2 class="font-extrabold text-slate-900 text-[18px] mb-5 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600"><i class="fa-solid fa-globe"></i></div> กระดานเคสรวม</h2>
            <div class="relative mb-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-lg"></i>
                <input type="text" id="feed-search" placeholder="พิมพ์ HN หรือ ชื่อโรค เพื่อค้นหา..." class="input-wow w-full text-[14px] pl-12 pr-4 py-4" onkeyup="filterFeed()">
            </div>
            <div id="feed-container" class="space-y-4"><p class="text-center text-[13px] font-bold text-slate-500 py-10"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> กำลังโหลดข้อมูล...</p></div>
        </div>

        <div id="view-dashboard" class="hidden glass-card p-6 mb-6">
            <div id="dash-instructor" class="hidden mb-10 border-b-2 border-slate-100 pb-8">
                <h2 class="font-extrabold text-slate-900 text-[20px] mb-5 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-orange-100 flex items-center justify-center text-orange-600"><i class="fa-solid fa-inbox text-lg"></i></div> ระบบตรวจประเมิน</h2>
                
                <div class="flex gap-2 overflow-x-auto no-scrollbar mb-4 pt-2 pb-3 px-1 -mx-1" id="filter-students">
                    <button class="filter-pill active-std" onclick="setStudentFilter('all')" id="btn-std-all">รวมทุกคน</button>
                </div>
                <div class="flex gap-2 overflow-x-auto no-scrollbar mb-6 pt-2 pb-3 px-1 -mx-1">
                    <button class="filter-pill active-pending" onclick="setStatusFilter('pending')" id="btn-stat-pending">⏳ รอตรวจ</button>
                    <button class="filter-pill" onclick="setStatusFilter('approved')" id="btn-stat-approved">✅ ตรวจแล้ว</button>
                    <button class="filter-pill" onclick="setStatusFilter('returned')" id="btn-stat-returned">⚠️ ส่งแก้</button>
                </div>
                
                <div id="instructor-cases-container" class="space-y-4"><p class="text-center text-[13px] font-bold text-slate-500 py-6"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> ดึงข้อมูลเคส...</p></div>
            </div>

            <h2 class="font-extrabold text-indigo-700 text-[18px] mb-5 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600"><i class="fa-solid fa-chart-pie"></i></div> ความคืบหน้านักศึกษา</h2>
            <div id="student-stats-container" class="space-y-5 mb-10"></div>

            <h2 class="font-extrabold text-teal-700 text-[18px] mb-5 flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-teal-100 flex items-center justify-center text-teal-600"><i class="fa-solid fa-ranking-star"></i></div> อันดับโรคยอดฮิต</h2>
            <div id="disease-rank-container" class="bg-white/80 rounded-[1.5rem] p-5 border border-white shadow-sm"></div>
        </div>

    </div>

                    <button id="judge-submit-btn" class="flex-1 py-3.5 text-white font-extrabold text-[13px] bg-gradient-to-r from-orange-500 to-amber-500 rounded-full shadow-lg shadow-orange-500/40 btn-glow">ยืนยันบันทึก</button>

    <nav class="fixed floating-nav z-50 backdrop-blur-xl px-2 py-2 flex justify-between items-center">

            <div class="icon-box text-[22px] mb-1"><i class="fa-solid fa-plus-circle"></i></div><span class="text-[10px] font-extrabold tracking-wide">เพิ่มเคส</span>
        </button>

        </button>

            <div class="icon-box text-[22px] mb-1"><i class="fa-solid fa-chart-pie"></i></div><span class="text-[10px] font-extrabold tracking-wide">สถิติ/ตรวจ</span>
        </button>

    <script>
        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';
        const FIREBASE_SECRET = '9iKYKSmC8ssrUXvEdh2OOqS4JCeyEwcaCGr83WkG';
        const LIFF_ID = "2010280091-6e8mWiGV";
        
        // ⚠️ ลิงก์ Web App ล่าสุดของอาจารย์ครับ
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxFeZxtiaQ_TgT6Hzd0bDo19rbM8SjmGVMMid9BQanch9pyEtOB2ivlXtF6tB9xQGuKKQ/exec";

        let currentUser = null; let instructorList = []; let currentEditCaseId = null;
        let allInstructorCases = []; let currentStatusFilter = 'pending'; let currentStudentFilter = 'all';

        window.onload = async () => {
            const today = new Date(); document.getElementById('msg_date').valueAsDate = today; document.getElementById('mid_date').valueAsDate = today; document.getElementById('med_date').valueAsDate = today;
            await loadDropdownConfigs(); await fetchUsersAndRenderInstructors(); await initializeLiff();
        };

        // ================= ฟังก์ชันแปลงเวลาให้เป็นภาษาไทย =================
        function formatTimeThai(timestamp) {
            if (!timestamp) return "-";
            const d = new Date(timestamp);
            return d.toLocaleDateString('th-TH', { year: '2-digit', month: 'short', day: 'numeric' }) + " เวลา " + 
                   d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + " น.";
        }

        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`); const configs = await res.json();
                if (configs?.diseases_massage) {
                    const msgSelect = document.getElementById('msg_diseaseName'); msgSelect.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(configs.diseases_massage)) msgSelect.innerHTML += `<option value="${name}" class="font-semibold text-slate-700">${code}: ${name}</option>`;
                }
                if (configs?.diseases_medicine) {
                    const medSelect = document.getElementById('med_diseaseName'); medSelect.innerHTML = '<option value="">-- เลือกการวินิจฉัย --</option>';
                    for (const [code, obj] of Object.entries(configs.diseases_medicine)) medSelect.innerHTML += `<option value="${obj.name}" data-category="${obj.type}" class="font-semibold text-slate-700">${code}: ${obj.name}</option>`;
                }
            } catch (e) {}
        }

        async function fetchUsersAndRenderInstructors() {
            try {
                const res = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`); const users = await res.json();
                for (const uid in users) if (users[uid].role === 'instructor' && users[uid].isActive) instructorList.push({ uid: uid, name: users[uid].fullName, picUrl: users[uid].picUrl });
                ['massage', 'midwifery', 'medicine'].forEach(dep => {
                    const container = document.getElementById(`instructors_${dep}`);
                    if(container) container.innerHTML = instructorList.map((inst, index) => `<div class="relative"><input type="radio" name="instructor_${dep}" id="inst_${dep}_${index}" value="${inst.uid}" class="instructor-radio hidden" required><label for="inst_${dep}_${index}" class="cursor-pointer border-2 border-transparent bg-white/70 rounded-[1.2rem] p-2 flex flex-col items-center gap-1.5 transition-all relative shadow-sm hover:bg-white"><div class="avatar-ring"><img src="${inst.picUrl}" class="w-10 h-10 rounded-full object-cover border border-white"></div><span class="text-[11px] font-extrabold text-slate-700 text-center truncate w-full">${inst.name.split(' ')[0]}</span><div class="check-icon absolute -top-1 -right-1 bg-emerald-500 text-white w-6 h-6 rounded-full flex items-center justify-center shadow-md"><i class="fa-solid fa-check text-[10px]"></i></div></label></div>`).join('');
                });
            } catch (e) {}
        }

        async function initializeLiff() { 
            try { 
                await liff.init({ liffId: LIFF_ID }); 
                if (liff.isLoggedIn()) checkUserPermission(await liff.getProfile()); else liff.login(); 
            } catch (err) { 
                Swal.fire({icon: 'error', title: 'ข้อผิดพลาด', text: 'ไม่สามารถโหลดระบบ LINE ได้ครับ', confirmButtonColor: '#ef4444'}); 
            } 
        }

        async function checkUserPermission(profile) {
            try {
                const res = await fetch(`${FIREBASE_URL}users/${profile.userId}.json?auth=${FIREBASE_SECRET}`); 
                const userData = await res.json();
                const firstName = profile.displayName.split(' ')[0]; 
                document.getElementById('userName').innerText = userData && userData.isActive ? firstName : profile.displayName; 
                document.getElementById('userImg').src = profile.pictureUrl;
                
                const roleContainer = document.getElementById('userRoleContainer');
                if (userData && userData.isActive) {
                    currentUser = { uid: profile.userId, ...userData };
                    
                    if (userData.role === 'instructor') { 
                        roleContainer.innerHTML = '<span class="text-[10px] font-extrabold text-white bg-gradient-to-r from-orange-500 to-amber-500 px-3 py-1 rounded-full mt-1 inline-block shadow-sm">⭐ อาจารย์แพทย์</span>';
                        document.getElementById('dash-instructor').classList.remove('hidden'); 
                        
                        document.getElementById('nav-forms').style.display = 'none';
                        document.getElementById('nav-mycases').style.display = 'none';
                        document.getElementById('nav-feed').classList.replace('w-[24%]', 'w-[48%]');
                        document.getElementById('nav-dashboard').classList.replace('w-[24%]', 'w-[48%]');
                        
                        switchMainView('dashboard'); 
                        loadDashboardData();
                    } else { 
                        roleContainer.innerHTML = '<span class="text-[10px] font-extrabold text-white bg-gradient-to-r from-emerald-500 to-teal-500 px-3 py-1 rounded-full mt-1 inline-block shadow-sm">🎓 นศ.แพทย์แผนไทย</span>';
                        switchMainView('forms');
                    }
                } else { 
                    document.getElementById('userName').innerText = "Access Denied"; 
                    roleContainer.innerHTML = '<span class="text-[10px] font-extrabold text-white bg-slate-500 px-3 py-1 rounded-full mt-1 inline-block shadow-sm">ไม่มีสิทธิ์ใช้งาน</span>';
                }
            } catch (e) { console.error("Permission Check Error", e); }
        }

        function switchMainView(viewId) {
            ['forms', 'mycases', 'feed', 'dashboard'].forEach(id => { document.getElementById(`view-${id}`).classList.add('hidden'); document.getElementById(`view-${id}`).classList.remove('animate-tab'); document.getElementById(`nav-${id}`).classList.remove('active', 'text-emerald-600'); document.getElementById(`nav-${id}`).classList.add('text-slate-500'); });
            const v = document.getElementById(`view-${viewId}`); v.classList.remove('hidden'); void v.offsetWidth; v.classList.add('animate-tab');
            const n = document.getElementById(`nav-${viewId}`); n.classList.remove('text-slate-500'); n.classList.add('active', 'text-emerald-600');
        }

        function switchForm(dep) {
            ['massage', 'midwifery', 'medicine'].forEach(id => { document.getElementById(`form-${id}`).classList.add('hidden'); document.getElementById(`sub-${id}`).classList.remove('active', 'active-mid', 'active-med'); });
            document.getElementById(`form-${dep}`).classList.remove('hidden');
            const btn = document.getElementById(`sub-${dep}`); btn.classList.add('active');
            if(dep === 'midwifery') btn.classList.add('active-mid'); if(dep === 'medicine') btn.classList.add('active-med');
        }

        async function submitCaseAction(department, isDraft) {
            if (!currentUser) return Swal.fire({icon: 'info', title: 'รอสักครู่', text: 'กำลังดึงข้อมูลเข้าระบบ กรุณารอสักครู่ครับ', confirmButtonColor: '#3b82f6'});
            
            const formObj = document.getElementById(`formObj-${department}`); 
            if (!formObj.checkValidity()) { formObj.reportValidity(); return; }
            
            const selectedInstructor = document.querySelector(`input[name="instructor_${department}"]:checked`); 
            if (!selectedInstructor) return Swal.fire({icon: 'warning', title: 'ลืมเลือกอาจารย์!', text: 'กรุณาเลือกอาจารย์ผู้ตรวจประเมินก่อนกดบันทึกครับ', confirmButtonColor: '#f59e0b'});

            const btnPrimary = document.querySelector(`#form-${department} .btn-primary`); const btnOutline = document.querySelector(`#form-${department} .btn-outline`);
            btnPrimary.disabled = true; btnOutline.disabled = true; const originalText = isDraft ? btnOutline.innerHTML : btnPrimary.innerHTML;
            if(isDraft) btnOutline.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i> บันทึก...`; else btnPrimary.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i> ส่ง...`;

            try {
                let base64String = ""; let mimeType = ""; let fileName = ""; const fileInput = document.getElementById(`${department === 'massage' ? 'msg' : department === 'midwifery' ? 'mid' : 'med'}_image`);
                if (fileInput && fileInput.files.length > 0) { const file = fileInput.files[0]; if (file.size > 5 * 1024 * 1024) { Swal.fire({icon: 'error', title: 'ไฟล์ใหญ่เกินไป', text: 'กรุณาอัปโหลดรูปขนาดไม่เกิน 5MB ครับ', confirmButtonColor: '#ef4444'}); throw new Error("Size"); } fileName = department + "_" + Date.now() + "_" + file.name; mimeType = file.type; base64String = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = e => rej(e); r.readAsDataURL(file); }); }

                let payload = { action: "saveCaseData", department: department, studentUid: currentUser.uid, studentName: currentUser.fullName, instructorUid: selectedInstructor.value, status: isDraft ? 'draft' : 'pending', imageB64: base64String, imageMimeType: mimeType, imageName: fileName, caseId: currentEditCaseId, existingImageUrl: window.tempImageUrl || null };
                
                if (department === 'massage') { payload.date = document.getElementById('msg_date').value; payload.hn = document.getElementById('msg_hn').value; payload.patientName = document.getElementById('msg_patientName').value; payload.caseType = document.getElementById('msg_caseType').value; payload.diseaseCategory = document.getElementById('msg_diseaseCategory').value; payload.diseaseName = document.getElementById('msg_diseaseName').value; } 
                else if (department === 'midwifery') { payload.date = document.getElementById('mid_date').value; payload.hn = document.getElementById('mid_hn').value; payload.patientName = document.getElementById('mid_patientName').value; } 
                else if (department === 'medicine') { payload.date = document.getElementById('med_date').value; payload.hn = document.getElementById('med_hn').value; payload.patientName = document.getElementById('med_patientName').value; const medSelect = document.getElementById('med_diseaseName'); payload.diseaseName = medSelect.value; payload.diseaseCategory = medSelect.options[medSelect.selectedIndex] ? medSelect.options[medSelect.selectedIndex].getAttribute('data-category') : 'โรคทั่วไป'; payload.caseType = 'New'; }

                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) }); const result = await res.json(); 
                
                Swal.fire({ icon: result.success ? 'success' : 'error', title: result.success ? 'สำเร็จ!' : 'ข้อผิดพลาด', text: result.message, showConfirmButton: !result.success, confirmButtonColor: '#10b981', timer: result.success ? 2000 : undefined });
                
                if (result.success) { formObj.reset(); cancelEdit(); document.getElementById(department === 'massage' ? 'msg_date' : department === 'midwifery' ? 'mid_date' : 'med_date').valueAsDate = new Date(); if(isDraft) { switchMainView('mycases'); loadMyCases(); } }
            } catch (err) { if(err.message !== "Size") Swal.fire({icon: 'error', title: 'การเชื่อมต่อขัดข้อง', text: 'เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์ กรุณาลองใหม่ครับ', confirmButtonColor: '#ef4444'}); } 
            finally { btnPrimary.disabled = false; btnOutline.disabled = false; if(isDraft) btnOutline.innerHTML = originalText; else btnPrimary.innerHTML = originalText; }
        }

        async function loadMyCases() {
            const container = document.getElementById('mycases-container'); container.innerHTML = '<p class="text-center text-[13px] font-bold text-slate-500 py-10"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> กำลังโหลดเคสของคุณ...</p>';
            try {
                let html = ""; const deps = ['massage', 'midwifery', 'medicine'];
                for (let dep of deps) {
                    const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`); const cases = await res.json();
                    for (let cid in cases) {
                        const c = cases[cid];
                        if (c.studentUid === currentUser.uid) {
                            let badge = c.status === 'draft' ? '<span class="badge badge-draft">📝 ร่าง</span>' : c.status === 'pending' ? '<span class="badge badge-pending">⏳ รอตรวจ</span>' : c.status === 'returned' ? '<span class="badge badge-returned">⚠️ ส่งแก้</span>' : '<span class="badge badge-approved">✅ ผ่านแล้ว</span>';
                            
                            let actionBtns = "";
                            if (c.status === 'draft' || c.status === 'returned') {
                                actionBtns = `
                                <div class="flex gap-2 mt-4">
                                    <button onclick='editDraft(${JSON.stringify(c)}, "${dep}", "${cid}")' class="flex-1 text-[11px] font-extrabold text-blue-600 bg-blue-50 px-4 py-2.5 rounded-xl border border-blue-200 hover:bg-blue-100 transition"><i class="fa-solid fa-pen"></i> แก้ไข & ส่งตรวจ</button>
                                    <button onclick='deleteCaseData("${dep}", "${cid}")' class="text-[11px] font-extrabold text-rose-600 bg-rose-50 px-4 py-2.5 rounded-xl border border-rose-200 hover:bg-rose-100 transition shadow-sm"><i class="fa-solid fa-trash"></i> ลบ</button>
                                </div>`;
                            }
                            
                            let remarkAlert = c.status === 'returned' && c.remark ? `<div class="mt-3 text-[11px] text-rose-700 bg-rose-50 p-2.5 rounded-xl border border-rose-200"><b>หมายเหตุ:</b> ${c.remark}</div>` : "";
                            let instImgBtn = (c.instructorImageUrl && c.instructorImageUrl !== "-") ? `<a href="${c.instructorImageUrl}" target="_blank" class="mt-3 ml-2 inline-block text-[11px] font-extrabold text-orange-600 bg-orange-50 px-3 py-2 rounded-xl border border-orange-200 hover:bg-orange-100 transition"><i class="fa-solid fa-image"></i> รูปจากอาจารย์</a>` : "";
                            let myImgBtn = (c.imageUrl && c.imageUrl !== "-") ? `<a href="${c.imageUrl}" target="_blank" class="mt-3 inline-block text-[11px] font-extrabold text-emerald-600 bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-200 hover:bg-emerald-100 transition"><i class="fa-solid fa-image"></i> รูปของคุณ</a>` : "";

                            html += `<div class="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100" id="card_${cid}">
                                        <div class="flex justify-between items-start mb-2">
                                            <p class="text-[14px] font-extrabold text-slate-900">HN: ${c.hn}</p>
                                            ${badge}
                                        </div>
                                        <p class="text-[13px] font-extrabold text-slate-700">${c.patientName}</p>
                                        <p class="text-[10px] text-slate-400 mt-1"><i class="fa-regular fa-clock"></i> อัปเดตล่าสุด: ${formatTimeThai(c.timestamp)}</p>
                                        <p class="text-[11px] font-bold text-slate-500 mt-2 truncate">📌 ${c.diseaseName || 'ผดุงครรภ์'}</p>
                                        ${remarkAlert}
                                        <div class="flex flex-wrap items-center mt-1">${myImgBtn}${instImgBtn}</div>
                                        ${actionBtns}
                                     </div>`;
                        }
                    }
                }
                container.innerHTML = html || '<p class="text-center text-[13px] font-bold text-slate-500 py-10">ยังไม่มีเคสที่บันทึกไว้ครับ</p>';
            } catch(e) { container.innerHTML = '<p class="text-center text-[13px] font-bold text-red-500 py-10">โหลดข้อมูลล้มเหลว</p>'; }
        }

        function editDraft(data, dep, cid) {
            currentEditCaseId = cid; window.tempImageUrl = data.imageUrl; switchMainView('forms'); switchForm(dep); document.getElementById('edit-banner').classList.remove('hidden');
            let pre = dep === 'massage' ? 'msg' : dep === 'midwifery' ? 'mid' : 'med'; document.getElementById(`${pre}_date`).value = data.date; document.getElementById(`${pre}_hn`).value = data.hn; document.getElementById(`${pre}_patientName`).value = data.patientName;
            if(dep === 'massage') { document.getElementById('msg_caseType').value = data.caseType; document.getElementById('msg_diseaseCategory').value = data.diseaseCategory; document.getElementById('msg_diseaseName').value = data.diseaseName; }
            if(dep === 'medicine') { document.getElementById('med_diseaseName').value = data.diseaseName; }
            const radios = document.getElementsByName(`instructor_${dep}`); for(let i=0; i<radios.length; i++) if(radios[i].value === data.instructorUid) radios[i].checked = true;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEdit() { currentEditCaseId = null; window.tempImageUrl = null; document.getElementById('edit-banner').classList.add('hidden'); document.getElementById('formObj-massage').reset(); document.getElementById('formObj-midwifery').reset(); document.getElementById('formObj-medicine').reset(); const today = new Date(); document.getElementById('msg_date').valueAsDate = today; document.getElementById('mid_date').valueAsDate = today; document.getElementById('med_date').valueAsDate = today; }

        async function loadGlobalFeed() {
            const container = document.getElementById('feed-container'); container.innerHTML = '<p class="text-center text-[13px] font-bold text-slate-500 py-10"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> กำลังโหลดเคสรวม...</p>';
            try {
                let html = ""; const deps = ['massage', 'midwifery', 'medicine']; let allCases = [];
                for (let dep of deps) { const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`); const cases = await res.json(); for (let cid in cases) { if(cases[cid].status !== 'draft') allCases.push({...cases[cid], depName: dep}); } }
                allCases.sort((a,b) => b.timestamp - a.timestamp);
                
                allCases.forEach(c => { 
                    let badge = c.status === 'pending' ? '⏳ รอตรวจ' : c.status === 'returned' ? '⚠️ แก้ไข' : '✅ ผ่าน'; 
                    html += `<div class="feed-card bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100">
                                <div class="flex justify-between items-start mb-2">
                                    <p class="text-[14px] font-extrabold text-slate-900">HN: <span class="search-target">${c.hn}</span></p>
                                    <span class="text-[10px] font-bold text-slate-500">${badge}</span>
                                </div>
                                <p class="text-[13px] font-extrabold text-slate-700 search-target">${c.patientName}</p>
                                <p class="text-[10px] text-slate-400 mt-1"><i class="fa-regular fa-clock"></i> ส่งเมื่อ: ${formatTimeThai(c.timestamp)}</p>
                                <div class="flex justify-between items-end mt-3">
                                    <p class="text-[11px] font-bold text-slate-500 truncate w-2/3 search-target">📌 ${c.diseaseName || 'ผดุงครรภ์'}</p>
                                    <p class="text-[10px] font-extrabold text-emerald-700 bg-emerald-100 px-3 py-1 rounded-xl">นศ. ${c.studentName.split(' ')[0]}</p>
                                </div>
                             </div>`; 
                });
                container.innerHTML = html || '<p class="text-center text-[13px] font-bold text-slate-500 py-10">ยังไม่มีเคสในระบบ</p>';
            } catch(e) {}
        }
        function filterFeed() { let input = document.getElementById('feed-search').value.toLowerCase(); let cards = document.getElementsByClassName('feed-card'); for (let i = 0; i < cards.length; i++) cards[i].style.display = cards[i].innerText.toLowerCase().includes(input) ? "" : "none"; }

        // ================= Dashboard อาจารย์ =================
        async function loadDashboardData() {
            const statsContainer = document.getElementById('student-stats-container'); const rankContainer = document.getElementById('disease-rank-container');
            statsContainer.innerHTML = '<p class="text-center text-[13px] font-bold text-slate-500 py-6"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> กำลังโหลดข้อมูล...</p>';
            
            try {
                if (currentUser.role === 'instructor') {
                    document.getElementById('instructor-cases-container').innerHTML = '<p class="text-center text-[13px] font-bold text-slate-500 py-6"><i class="fa-solid fa-spinner fa-spin text-xl mb-2 block"></i> ดึงข้อมูลเคส...</p>';
                    allInstructorCases = []; const deps = ['massage', 'midwifery', 'medicine']; let studentSet = new Set();
                    
                    for (let dep of deps) {
                        const res = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`); const cases = await res.json();
                        for (let cid in cases) {
                            if (cases[cid].instructorUid === currentUser.uid && cases[cid].status !== 'draft') {
                                allInstructorCases.push({...cases[cid], caseId: cid, depName: dep});
                                studentSet.add(JSON.stringify({uid: cases[cid].studentUid, name: cases[cid].studentName.split(' ')[0]}));
                            }
                        }
                    }
                    allInstructorCases.sort((a,b) => b.timestamp - a.timestamp); 

                    let stdHtml = `<button class="filter-pill ${currentStudentFilter === 'all' ? 'active-std' : ''}" onclick="setStudentFilter('all')" id="btn-std-all">รวมทุกคน</button>`;
                    Array.from(studentSet).forEach(sStr => { const s = JSON.parse(sStr); stdHtml += `<button class="filter-pill ${currentStudentFilter === s.uid ? 'active-std' : ''}" onclick="setStudentFilter('${s.uid}')" id="btn-std-${s.uid}">นศ. ${s.name}</button>`; });
                    document.getElementById('filter-students').innerHTML = stdHtml;
                    renderInstructorCases();
                }

                // สถิติ
                const usersRes = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`); const users = await usersRes.json(); let statsHtml = "";
                for (const uid in users) {
                    if (users[uid].role === 'student' && users[uid].isActive) {
                        const st = users[uid].stats || {}; const msgTotal = (st.massage_new || 0) + (st.massage_followup || 0); const midTotal = (st.midwifery || 0); const medTotal = (st.medicine_general || 0) + (st.medicine_ncd || 0);
                        let isMe = uid === currentUser.uid ? 'border-[2.5px] border-indigo-400 bg-indigo-50/50 shadow-md' : 'border border-slate-100 bg-white shadow-sm';
                        statsHtml += `<div class="${isMe} p-5 rounded-[1.5rem]"><div class="flex items-center gap-3 mb-4"><img src="${users[uid].picUrl}" class="w-10 h-10 rounded-full border border-slate-200"><p class="text-[14px] font-extrabold text-slate-900">${users[uid].fullName}</p></div><div class="space-y-4"><div><div class="flex justify-between text-[11px] text-slate-600 font-extrabold mb-1.5 uppercase tracking-wide"><span>นวดไทย (60)</span><span class="text-emerald-600">${msgTotal}/60</span></div><div class="w-full bg-slate-100 rounded-full h-2 shadow-inner"><div class="bg-gradient-to-r from-emerald-400 to-emerald-600 h-2 rounded-full shadow-sm" style="width: ${Math.min((msgTotal/60)*100, 100)}%"></div></div></div><div><div class="flex justify-between text-[11px] text-slate-600 font-extrabold mb-1.5 uppercase tracking-wide"><span>ผดุงครรภ์ (10)</span><span class="text-rose-600">${midTotal}/10</span></div><div class="w-full bg-slate-100 rounded-full h-2 shadow-inner"><div class="bg-gradient-to-r from-rose-400 to-rose-600 h-2 rounded-full shadow-sm" style="width: ${Math.min((midTotal/10)*100, 100)}%"></div></div></div><div><div class="flex justify-between text-[11px] text-slate-600 font-extrabold mb-1.5 uppercase tracking-wide"><span>เวชกรรม (20)</span><span class="text-blue-600">${medTotal}/20</span></div><div class="w-full bg-slate-100 rounded-full h-2 shadow-inner"><div class="bg-gradient-to-r from-blue-400 to-blue-600 h-2 rounded-full shadow-sm" style="width: ${Math.min((medTotal/20)*100, 100)}%"></div></div></div></div></div>`;
                    }
                }
                statsContainer.innerHTML = statsHtml || '<p class="text-center text-[13px] font-bold text-slate-500 py-6">ยังไม่มีข้อมูล</p>';
                
                let diseaseCount = {}; for (let dep of ['massage', 'medicine']) { const caseRes = await fetch(`${FIREBASE_URL}cases/${dep}.json?auth=${FIREBASE_SECRET}`); const allCases = await caseRes.json(); for (let cid in allCases) if (allCases[cid].status === 'approved' && allCases[cid].diseaseName) diseaseCount[allCases[cid].diseaseName] = (diseaseCount[allCases[cid].diseaseName] || 0) + 1; }
                const sortedRank = Object.entries(diseaseCount).sort((a, b) => b[1] - a[1]).slice(0, 5);
                if (sortedRank.length > 0) { let rankHtml = '<ul class="space-y-4">'; sortedRank.forEach((item, index) => { let m = index === 0 ? '<span class="text-2xl drop-shadow-md">🥇</span>' : index === 1 ? '<span class="text-2xl drop-shadow-md">🥈</span>' : index === 2 ? '<span class="text-2xl drop-shadow-md">🥉</span>' : `<span class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full text-[12px] font-extrabold text-slate-500 shadow-inner">${index+1}</span>`; rankHtml += `<li class="flex justify-between items-center text-[13px] border-b border-slate-100 pb-3 last:border-0 last:pb-0"><div class="flex items-center gap-3 truncate w-3/4">${m}<span class="truncate font-extrabold text-slate-800">${item[0]}</span></div><span class="font-extrabold text-teal-700 bg-teal-50 px-3 py-1.5 rounded-xl border border-teal-100">${item[1]}</span></li>`; }); rankContainer.innerHTML = rankHtml + '</ul>'; } else rankContainer.innerHTML = '<p class="text-center text-[13px] font-bold text-slate-500 py-6">ยังไม่มีข้อมูล</p>';
            } catch(e) {}
        }

        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.getElementById('btn-stat-pending').className = `filter-pill ${status === 'pending' ? 'active-pending' : ''}`;
            document.getElementById('btn-stat-approved').className = `filter-pill ${status === 'approved' ? 'active-approved' : ''}`;
            document.getElementById('btn-stat-returned').className = `filter-pill ${status === 'returned' ? 'active-returned' : ''}`;
            renderInstructorCases();
        }

        function setStudentFilter(uid) {
            currentStudentFilter = uid;
            document.querySelectorAll('#filter-students .filter-pill').forEach(btn => btn.classList.remove('active-std'));
            document.getElementById(`btn-std-${uid}`).classList.add('active-std');
            renderInstructorCases();
        }

        function renderInstructorCases() {
            const container = document.getElementById('instructor-cases-container'); let html = "";
            const filtered = allInstructorCases.filter(c => c.status === currentStatusFilter && (currentStudentFilter === 'all' || c.studentUid === currentStudentFilter));
            
            filtered.forEach(c => {
                let imageBtn = (c.imageUrl && c.imageUrl !== "-") ? `<a href="${c.imageUrl}" target="_blank" class="inline-block mt-2 text-[11px] font-extrabold bg-slate-800 text-white px-3 py-1.5 rounded-xl hover:bg-slate-700 transition"><i class="fa-solid fa-image"></i> รูปจาก นศ.</a>` : "";
                let buttons = ""; let remarkTxt = "";
                let deleteIconBtn = `<button onclick="deleteCaseData('${c.depName}', '${c.caseId}')" class="absolute top-4 right-5 text-slate-300 hover:text-rose-500 transition"><i class="fa-solid fa-trash text-lg"></i></button>`;
                
                if (c.status === 'pending') {
                    buttons = `<div class="flex gap-3"><button onclick="judgeCase('${c.depName}', '${c.caseId}', 'approved')" class="btn-glow bg-emerald-500 text-white flex-1 text-[12px] font-extrabold py-3 rounded-xl shadow-lg shadow-emerald-500/30"><i class="fa-solid fa-check text-lg mb-1 block"></i> ผ่าน</button><button onclick="judgeCase('${c.depName}', '${c.caseId}', 'returned')" class="btn-glow bg-amber-500 text-white flex-1 text-[12px] font-extrabold py-3 rounded-xl shadow-lg shadow-amber-500/30"><i class="fa-solid fa-rotate-left text-lg mb-1 block"></i> ส่งแก้</button><button onclick="judgeCase('${c.depName}', '${c.caseId}', 'rejected')" class="btn-glow bg-rose-600 text-white flex-1 text-[12px] font-extrabold py-3 rounded-xl shadow-lg shadow-rose-600/30"><i class="fa-solid fa-xmark text-lg mb-1 block"></i> ปฏิเสธ</button></div>`;
                } else if (c.status === 'returned' && c.remark) {
                    remarkTxt = `<p class="text-[11px] text-rose-700 bg-rose-50 p-2.5 rounded-xl border border-rose-200 mt-3"><b>หมายเหตุ:</b> ${c.remark}</p>`;
                }
                
                html += `<div class="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100 mb-4 relative" id="card_${c.caseId}">
                            ${deleteIconBtn}
                            <div class="flex justify-between items-start mb-1 pr-8">
                                <p class="text-[14px] font-extrabold text-slate-900">${c.studentName}</p>
                                <p class="text-[11px] font-bold text-slate-500">HN: ${c.hn}</p>
                            </div>
                            <p class="text-[10px] text-slate-400 mb-3"><i class="fa-regular fa-clock"></i> ส่งเมื่อ: ${formatTimeThai(c.timestamp)}</p>
                            <div class="bg-slate-50 p-4 rounded-[1.25rem] border border-slate-100 mb-4">
                                <p class="text-[13px] font-extrabold text-slate-700">📌 ${c.diseaseName || 'หมวด: ' + c.depName}</p>
                                ${imageBtn}${remarkTxt}
                            </div>
                            ${buttons}
                         </div>`;
            });
            container.innerHTML = html || `<p class="text-center text-[13px] font-bold text-slate-500 py-6">ไม่มีข้อมูลในหมวดนี้ครับ</p>`;
        }

        let pendingJudgeData = null; 
        function judgeCase(department, caseId, status) {
            pendingJudgeData = { department, caseId, status }; document.getElementById('judge-remark').value = ""; document.getElementById('judge-image').value = ""; document.getElementById('judge-modal').classList.remove('hidden');
            const title = document.getElementById('judge-title');
            if(status === 'approved') { title.innerHTML = '<i class="fa-solid fa-check-circle text-xl align-middle"></i> อนุมัติผ่านเคสนี้'; title.parentElement.className = 'bg-gradient-to-r from-emerald-500 to-teal-600 p-5 text-center'; }
            else if(status === 'returned') { title.innerHTML = '<i class="fa-solid fa-rotate-left text-xl align-middle"></i> ส่งกลับให้แก้ไข'; title.parentElement.className = 'bg-gradient-to-r from-amber-500 to-orange-500 p-5 text-center'; }
            else { title.innerHTML = '<i class="fa-solid fa-xmark-circle text-xl align-middle"></i> ปฏิเสธเคสนี้'; title.parentElement.className = 'bg-gradient-to-r from-red-600 to-rose-700 p-5 text-center'; }
            document.getElementById('judge-submit-btn').onclick = submitJudgeResult;
        }

        function closeJudgeModal() { document.getElementById('judge-modal').classList.add('hidden'); pendingJudgeData = null; }

        async function submitJudgeResult() {
            if (!pendingJudgeData) return; const { department, caseId, status } = pendingJudgeData; const remark = document.getElementById('judge-remark').value; const fileInput = document.getElementById('judge-image');
            const btn = document.getElementById('judge-submit-btn'); const originalText = btn.innerHTML; btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-lg"></i> กำลังบันทึก...`; btn.disabled = true;
            try {
                let base64String = ""; let mimeType = ""; let fileName = "";
                if (fileInput.files.length > 0) { const file = fileInput.files[0]; if (file.size > 5 * 1024 * 1024) { Swal.fire({icon: 'error', title: 'ไฟล์ใหญ่เกินไป', text: 'กรุณาอัปโหลดรูปขนาดไม่เกิน 5MB ครับ', confirmButtonColor: '#ef4444'}); btn.innerHTML = originalText; btn.disabled = false; return; } fileName = `INSTRUCTOR_${department}_${Date.now()}_${file.name}`; mimeType = file.type; base64String = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = e => rej(e); r.readAsDataURL(file); }); }
                const payload = { action: "updateCaseStatus", department: department, caseId: caseId, status: status, remark: remark, instructorUid: currentUser.uid, imageB64: base64String, imageMimeType: mimeType, imageName: fileName };
                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) }); const result = await res.json();
                
                if (result.success) { 
                    Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: 'ระบบได้ส่งแจ้งเตือนให้นักศึกษาแล้วครับ', showConfirmButton: false, timer: 1500 });
                    closeJudgeModal(); 
                    const caseIndex = allInstructorCases.findIndex(c => c.caseId === caseId);
                    if(caseIndex > -1) { allInstructorCases[caseIndex].status = status; allInstructorCases[caseIndex].remark = remark; }
                    renderInstructorCases(); 
                } else Swal.fire({ icon: 'error', title: 'ข้อผิดพลาด', text: result.message, confirmButtonColor: '#ef4444' });
            } catch (err) { Swal.fire({ icon: 'error', title: 'การเชื่อมต่อขัดข้อง', text: 'เกิดข้อผิดพลาดในการบันทึกข้อมูล', confirmButtonColor: '#ef4444' }); } 
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        }

        // ================= ฟังก์ชันลบเคส (ล้ำสมัยด้วย SweetAlert2) =================
        async function deleteCaseData(department, caseId) {
            const result = await Swal.fire({
                title: 'ยืนยันการลบเคส?',
                text: "หากลบแล้ว ข้อมูลนี้จะหายไปจากระบบทันที!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: '<i class="fa-solid fa-trash"></i> ใช่, ลบเลย!',
                cancelButtonText: 'ยกเลิก',
                reverseButtons: true
            });

            if (result.isConfirmed) {
                Swal.fire({ title: 'กำลังลบข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});
                try {
                    const payload = { action: "deleteCase", department: department, caseId: caseId };
                    const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const resData = await res.json();
                    
                    if (resData.success) {
                        Swal.fire({ icon: 'success', title: 'ลบสำเร็จ!', showConfirmButton: false, timer: 1500 });
                        
                        const card1 = document.getElementById(`card_${caseId}`);
                        if(card1) card1.remove();
                        
                        if(!document.getElementById('view-mycases').classList.contains('hidden')) loadMyCases();
                        if(!document.getElementById('view-dashboard').classList.contains('hidden')) loadDashboardData();
                        if(!document.getElementById('view-feed').classList.contains('hidden')) loadGlobalFeed();
                        
                    } else { Swal.fire('ข้อผิดพลาด', resData.message, 'error'); }
                } catch(e) { Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์', 'error'); }
            }
        }
    </script>
