<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกเคสแพทย์แผนไทย - รพ.สะเดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); 
            min-height: 100vh;
        }
        /* สไตล์ Glassmorphism โปร่งแสง */
        .glass-card { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
        }
        .tab-btn.active {
            border-bottom: 3px solid #16a34a;
            color: #16a34a;
            font-weight: 600;
        }
    </style>
</head>
<body class="pb-20">

    <div class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between mb-4">
        <div>
            <h1 class="text-lg font-bold text-green-800">TTMED STUDY</h1>
            <p class="text-xs text-gray-500">บันทึกเคสฝึกงาน รพ.สะเดา</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="text-right">
                <p id="userName" class="text-sm font-semibold text-gray-800">กำลังโหลด...</p>
                <p id="userRole" class="text-[10px] text-green-600 bg-green-100 px-2 py-0.5 rounded-full inline-block">Connecting</p>
            </div>
            <img id="userImg" src="https://ui-avatars.com/api/?name=User" class="w-10 h-10 rounded-full border-2 border-white shadow-sm">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-xl overflow-hidden flex mb-6 text-sm text-gray-500">
            <button onclick="switchTab('massage')" id="tab-massage" class="tab-btn active flex-1 py-3 text-center transition-all">นวดไทย</button>
            <button onclick="switchTab('midwifery')" id="tab-midwifery" class="tab-btn flex-1 py-3 text-center transition-all">ผดุงครรภ์</button>
            <button onclick="switchTab('medicine')" id="tab-medicine" class="tab-btn flex-1 py-3 text-center transition-all">เวชกรรม</button>
        </div>

        <div id="form-massage" class="glass-card p-5 rounded-2xl mb-6">
            <h2 class="font-bold text-green-700 mb-4 border-b border-green-200 pb-2"><i class="fa-solid fa-hands-bubbles mr-2"></i> บันทึกเคสนวดไทย</h2>
            
            <form id="massageForm" onsubmit="submitForm(event, 'massage')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่รับบริการ</label>
                        <input type="date" id="msg_date" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">HN</label>
                        <input type="text" id="msg_hn" placeholder="ระบุ HN" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label>
                    <input type="text" id="msg_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                </div>

                <div class="p-3 bg-green-50/50 rounded-xl border border-green-100 space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ประเภทเคส</label>
                        <select id="msg_caseType" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                            <option value="New">เคสใหม่ (New)</option>
                            <option value="FollowUp">ติดตามผล (Follow-up)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">กลุ่มโรค/อาการ</label>
                        <select id="msg_diseaseCategory" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                            <option value="โรคทางหัตถเวชกรรมไทย">โรคทางหัตถเวชกรรมไทย</option>
                            <option value="กลุ่มโรคไม่ติดต่อเรื้อรัง (NCDs)">กลุ่มโรคไม่ติดต่อเรื้อรัง (NCDs)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อโรคทางหัตถเวช / อาการ</label>
                        <select id="msg_diseaseName" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                            <option value="">-- กำลังโหลดข้อมูล... --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ระดับความเจ็บปวด (Pain Score: 0-10)</label>
                    <input type="range" id="msg_painScore" min="0" max="10" value="5" class="w-full accent-green-600" oninput="document.getElementById('painValue').innerText = this.value">
                    <div class="text-center text-sm font-bold text-green-700 mt-1">ระดับ: <span id="painValue">5</span></div>
                </div>

                <button type="submit" id="btn_submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-4">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและส่งตรวจ
                </button>
            </form>
        </div>
<div id="form-midwifery" class="hidden glass-card p-5 rounded-2xl mb-6">
            <h2 class="font-bold text-pink-600 mb-4 border-b border-pink-200 pb-2"><i class="fa-solid fa-person-breastfeeding mr-2"></i> บันทึกเคสผดุงครรภ์ไทย</h2>
            <form id="midwiferyForm" onsubmit="submitForm(event, 'midwifery')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่รับบริการ</label>
                        <input type="date" id="mid_date" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">HN มารดา</label>
                        <input type="text" id="mid_hn" placeholder="ระบุ HN" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-สกุล มารดาหลังคลอด</label>
                    <input type="text" id="mid_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                </div>

                <div class="p-3 bg-pink-50/50 rounded-xl border border-pink-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">ความดัน (BP)</label>
                            <input type="text" id="mid_bp" placeholder="เช่น 120/80" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">Latch Score ทารก</label>
                            <select id="mid_latchScore" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                                <option value="ดีมาก (8-10)">ดีมาก (8-10)</option>
                                <option value="ปานกลาง (4-7)">ปานกลาง (4-7)</option>
                                <option value="ต้องปรับปรุง (<4)">ต้องปรับปรุง (<4)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">สรุปหัตถการ/การดูแล (ย่อ)</label>
                        <textarea id="mid_treatment" rows="2" placeholder="เช่น นวดเปิดท่อน้ำนม, ทับหม้อเกลือ" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></textarea>
                    </div>
                </div>

                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-4">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและส่งตรวจ
                </button>
            </form>
        </div>

        <div id="form-medicine" class="hidden glass-card p-5 rounded-2xl mb-6">
            <h2 class="font-bold text-blue-600 mb-4 border-b border-blue-200 pb-2"><i class="fa-solid fa-stethoscope mr-2"></i> บันทึกเคสเวชกรรมไทย</h2>
            <form id="medicineForm" onsubmit="submitForm(event, 'medicine')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">วันที่รับบริการ</label>
                        <input type="date" id="med_date" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">HN</label>
                        <input type="text" id="med_hn" placeholder="ระบุ HN" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label>
                    <input type="text" id="med_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div class="p-3 bg-blue-50/50 rounded-xl border border-blue-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">ประเภทเคส</label>
                            <select id="med_caseType" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                                <option value="New">เคสใหม่ (New)</option>
                                <option value="FollowUp">ติดตามผล (Follow-up)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1">หมวดหมู่เป้าหมาย</label>
                            <select id="med_diseaseCategory" class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                                <option value="โรคทั่วไป">โรคทั่วไป</option>
                                <option value="โรค NCDs">โรคไม่ติดต่อเรื้อรัง (NCDs)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">การวินิจฉัยโรคแผนไทย</label>
                        <select id="med_diseaseName" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                            <option value="">-- กำลังโหลดข้อมูล... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">รูปแบบการรักษาหลัก</label>
                        <select id="med_treatmentForm" required class="w-full bg-white/80 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                            <option value="จ่ายยาสมุนไพร">จ่ายยาสมุนไพร</option>
                            <option value="หัตถการ">หัตถการ</option>
                            <option value="จ่ายยาและหัตถการ">จ่ายยาและหัตถการ</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-4">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและส่งตรวจ
                </button>
            </form>
        </div>
    <script>
        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';
        const FIREBASE_SECRET = '9iKYKSmC8ssrUXvEdh2OOqS4JCeyEwcaCGr83WkG';
        let currentUser = null;

        // โหลดข้อมูล Config ทันทีที่เปิดหน้าเว็บ
        window.onload = async () => {
            document.getElementById('msg_date').valueAsDate = new Date();
            await loadDropdownConfigs();
            // TODO: Initialize LIFF ตรงนี้
        };

        // สลับ Tab เมนู
        function switchTab(tabId) {
            ['massage', 'midwifery', 'medicine'].forEach(id => {
                document.getElementById(`form-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('active');
            });
            document.getElementById(`form-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // ดึงข้อมูลโรคจาก Firebase มาใส่ Dropdown
        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`);
                const data = await res.json();
                
                if (data && data.diseases_massage) {
                    const select = document.getElementById('msg_diseaseName');
                    select.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(data.diseases_massage)) {
                        select.innerHTML += `<option value="${name}">${code}: ${name}</option>`;
                    }
                }
            } catch (error) {
                console.error("Error loading configs:", error);
            }
        }

        // ฟังก์ชันจำลองการกดส่ง
        function submitForm(e, department) {
            e.preventDefault();
            alert(`เตรียมส่งเคส ${department} ผ่าน API ของ GAS`);
            // โค้ดส่งข้อมูลไปยัง GAS Web App จะเขียนในสเตปถัดไป
        }
    </script>
</body>
</html>
