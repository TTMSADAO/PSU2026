<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบันทึกเคส - รพ.สะเดา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
        body { font-family: 'Prompt', sans-serif; background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%); min-height: 100vh; }
        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .tab-btn.active { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: 600; }
        
        /* สไตล์ Custom Radio สำหรับเลือกอาจารย์ */
        .instructor-radio:checked + label { border-color: #16a34a; background-color: #f0fdf4; }
        .instructor-radio:checked + label img { border-color: #16a34a; transform: scale(1.05); }
        .instructor-radio:checked + label .check-icon { display: flex; }
    </style>
</head>
<body class="pb-20">

    <div class="glass-card sticky top-0 z-40 px-4 py-3 flex items-center justify-between mb-4">
        <div>
            <h1 class="text-lg font-bold text-green-800">TTMED STUDY</h1>
            <p class="text-xs text-gray-500">บันทึกเคสฝึกงาน รพ.สะเดา</p>
        </div>
        <div class="flex items-center gap-2">
            <div class="text-right">
                <p id="userName" class="text-sm font-semibold text-gray-800">กำลังโหลด...</p>
                <p id="userRole" class="text-[10px] text-gray-500 bg-gray-100 px-2 py-0.5 rounded-full inline-block">Connecting</p>
            </div>
            <img id="userImg" src="https://ui-avatars.com/api/?name=User" class="w-10 h-10 rounded-full border-2 border-white shadow-sm object-cover">
        </div>
    </div>

    <div class="max-w-md mx-auto px-4">
        <div class="glass-card rounded-xl overflow-hidden flex mb-6 text-sm text-gray-500 shadow-sm">
            <button onclick="switchTab('massage')" id="tab-massage" class="tab-btn active flex-1 py-3 text-center transition-all">นวดไทย</button>
            <button onclick="switchTab('midwifery')" id="tab-midwifery" class="tab-btn flex-1 py-3 text-center transition-all">ผดุงครรภ์</button>
            <button onclick="switchTab('medicine')" id="tab-medicine" class="tab-btn flex-1 py-3 text-center transition-all">เวชกรรม</button>
        </div>

        <div id="form-massage" class="glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-green-700 mb-4 border-b border-green-200 pb-2"><i class="fa-solid fa-hands-bubbles mr-2"></i> บันทึกเคสนวดไทย</h2>
            <form onsubmit="submitForm(event, 'massage')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่รับบริการ</label><input type="date" id="msg_date" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN</label><input type="text" id="msg_hn" placeholder="ระบุ HN" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="msg_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500"></div>

                <div class="p-3 bg-green-50/50 rounded-xl border border-green-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">ประเภทเคส</label>
                            <select id="msg_caseType" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                                <option value="New">🌟 เคสใหม่</option>
                                <option value="FollowUp">🔄 ติดตามผล</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">กลุ่มโรค</label>
                            <select id="msg_diseaseCategory" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                                <option value="โรคทางหัตถเวชกรรมไทย">หัตถเวชกรรมไทย</option>
                                <option value="กลุ่มโรคไม่ติดต่อเรื้อรัง (NCDs)">NCDs</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อโรค / อาการ</label>
                        <select id="msg_diseaseName" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-green-500">
                            <option value="">-- โหลดข้อมูล... --</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 mb-1">ระดับความเจ็บปวด (Pain Score)</label>
                    <input type="range" id="msg_painScore" min="0" max="10" value="5" class="w-full accent-green-600" oninput="document.getElementById('painValue').innerText = this.value">
                    <div class="text-center text-sm font-bold text-green-700 mt-1">ระดับ: <span id="painValue">5</span></div>
                </div>

                <div class="pt-2 border-t border-gray-200">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้คุม/ผู้ตรวจประเมิน</label>
                    <div id="instructors_massage" class="grid grid-cols-3 gap-2"></div>
                </div>

                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและแจ้งเตือนอาจารย์
                </button>
            </form>
        </div>

        <div id="form-midwifery" class="hidden glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-pink-600 mb-4 border-b border-pink-200 pb-2"><i class="fa-solid fa-person-breastfeeding mr-2"></i> บันทึกเคสผดุงครรภ์ไทย</h2>
            <form onsubmit="submitForm(event, 'midwifery')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่รับบริการ</label><input type="date" id="mid_date" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN มารดา</label><input type="text" id="mid_hn" placeholder="ระบุ HN" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล มารดาหลังคลอด</label><input type="text" id="mid_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></div>

                <div class="p-3 bg-pink-50/50 rounded-xl border border-pink-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ความดัน (BP)</label><input type="text" id="mid_bp" placeholder="120/80" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Latch Score</label>
                            <select id="mid_latchScore" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500">
                                <option value="ดีมาก (8-10)">ดีมาก (8-10)</option>
                                <option value="ปานกลาง (4-7)">ปานกลาง (4-7)</option>
                                <option value="ต้องปรับปรุง (<4)">ปรับปรุง (<4)</option>
                            </select>
                        </div>
                    </div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">สรุปหัตถการ/การดูแล (ย่อ)</label><textarea id="mid_treatment" rows="2" placeholder="เช่น นวดเปิดท่อน้ำนม..." class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-pink-500"></textarea></div>
                </div>

                <div class="pt-2 border-t border-gray-200">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้คุม/ผู้ตรวจประเมิน</label>
                    <div id="instructors_midwifery" class="grid grid-cols-3 gap-2"></div>
                </div>

                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและแจ้งเตือนอาจารย์
                </button>
            </form>
        </div>

        <div id="form-medicine" class="hidden glass-card p-5 rounded-2xl mb-6 shadow-sm">
            <h2 class="font-bold text-blue-600 mb-4 border-b border-blue-200 pb-2"><i class="fa-solid fa-stethoscope mr-2"></i> บันทึกเคสเวชกรรมไทย</h2>
            <form onsubmit="submitForm(event, 'medicine')" class="space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">วันที่รับบริการ</label><input type="date" id="med_date" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500"></div>
                    <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">HN</label><input type="text" id="med_hn" placeholder="ระบุ HN" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500"></div>
                </div>
                <div><label class="block text-[11px] font-semibold text-gray-600 mb-1">ชื่อ-สกุล ผู้ป่วย</label><input type="text" id="med_patientName" placeholder="ชื่อ นามสกุล" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500"></div>

                <div class="p-3 bg-blue-50/50 rounded-xl border border-blue-100 space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">ประเภทเคส</label>
                            <select id="med_caseType" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                                <option value="New">🌟 เคสใหม่</option>
                                <option value="FollowUp">🔄 ติดตามผล</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">เป้าหมาย</label>
                            <select id="med_diseaseCategory" class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                                <option value="โรคทั่วไป">โรคทั่วไป</option>
                                <option value="โรค NCDs">โรค NCDs</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">วินิจฉัยโรคแผนไทย</label>
                        <select id="med_diseaseName" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                            <option value="">-- โหลดข้อมูล... --</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 mb-1">การรักษาหลัก</label>
                        <select id="med_treatmentForm" required class="w-full bg-white/90 border border-gray-200 text-sm rounded-lg px-3 py-2 outline-none focus:border-blue-500">
                            <option value="จ่ายยาสมุนไพร">💊 จ่ายยาสมุนไพร</option>
                            <option value="หัตถการ">💆‍♂️ หัตถการ</option>
                            <option value="จ่ายยาและหัตถการ">🔄 จ่ายยา + หัตถการ</option>
                        </select>
                    </div>
                </div>

                <div class="pt-2 border-t border-gray-200">
                    <label class="block text-[11px] font-semibold text-gray-600 mb-2">เลือกอาจารย์ผู้คุม/ผู้ตรวจประเมิน</label>
                    <div id="instructors_medicine" class="grid grid-cols-3 gap-2"></div>
                </div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2 mt-2">
                    <i class="fa-solid fa-paper-plane"></i> บันทึกและแจ้งเตือนอาจารย์
                </button>
            </form>
        </div>
    </div>

    <script>
        const FIREBASE_URL = 'https://ttmedstudy-default-rtdb.asia-southeast1.firebasedatabase.app/';
        const FIREBASE_SECRET = '9iKYKSmC8ssrUXvEdh2OOqS4JCeyEwcaCGr83WkG';
        const LIFF_ID = "2010280091-6e8mWiGV";
        
        // ⚠️ นำ URL จาก Apps Script (Deploy) มาวางที่นี่
        const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbz_XXXXXXXXXXXXXX/exec"; 

        let currentUser = null; 
        let instructorList = [];

        window.onload = async () => {
            const today = new Date();
            document.getElementById('msg_date').valueAsDate = today;
            document.getElementById('mid_date').valueAsDate = today;
            document.getElementById('med_date').valueAsDate = today;

            await loadDropdownConfigs();
            await fetchUsersAndRenderInstructors(); 
            await initializeLiff();
        };

        // โหลดข้อมูล Dropdown โรค
        async function loadDropdownConfigs() {
            try {
                const res = await fetch(`${FIREBASE_URL}configs.json?auth=${FIREBASE_SECRET}`);
                const globalConfigs = await res.json();
                
                if (globalConfigs?.diseases_massage) {
                    const msgSelect = document.getElementById('msg_diseaseName');
                    msgSelect.innerHTML = '<option value="">-- เลือกโรค/อาการ --</option>';
                    for (const [code, name] of Object.entries(globalConfigs.diseases_massage)) msgSelect.innerHTML += `<option value="${name}">${code}: ${name}</option>`;
                }
                
                if (globalConfigs?.diseases_medicine) {
                    const medSelect = document.getElementById('med_diseaseName');
                    medSelect.innerHTML = '<option value="">-- เลือกการวินิจฉัย --</option>';
                    for (const [code, obj] of Object.entries(globalConfigs.diseases_medicine)) medSelect.innerHTML += `<option value="${obj.name}">${code}: ${obj.name}</option>`;
                }
            } catch (e) { console.error("Error configs:", e); }
        }

        // ดึงผู้ใช้งาน และสร้าง UI รูปโปรไฟล์อาจารย์
        async function fetchUsersAndRenderInstructors() {
            try {
                const res = await fetch(`${FIREBASE_URL}users.json?auth=${FIREBASE_SECRET}`);
                const users = await res.json();
                
                // คัดเฉพาะคนที่เป็น instructor
                for (const uid in users) {
                    if (users[uid].role === 'instructor' && users[uid].isActive) {
                        instructorList.push({ uid: uid, name: users[uid].fullName, picUrl: users[uid].picUrl });
                    }
                }
                
                // วาด UI ลงในทั้ง 3 ฟอร์ม
                ['massage', 'midwifery', 'medicine'].forEach(dep => {
                    const container = document.getElementById(`instructors_${dep}`);
                    container.innerHTML = instructorList.map((inst, index) => `
                        <div class="relative">
                            <input type="radio" name="instructor_${dep}" id="inst_${dep}_${index}" value="${inst.uid}" class="instructor-radio hidden" required>
                            <label for="inst_${dep}_${index}" class="cursor-pointer border border-gray-200 rounded-lg p-2 flex flex-col items-center gap-1 transition relative">
                                <img src="${inst.picUrl}" class="w-10 h-10 rounded-full border-2 border-transparent object-cover">
                                <span class="text-[10px] font-bold text-gray-700 text-center w-full truncate">${inst.name}</span>
                                <div class="check-icon hidden absolute -top-1 -right-1 bg-green-500 text-white w-4 h-4 rounded-full items-center justify-center shadow">
                                    <i class="fa-solid fa-check text-[9px]"></i>
                                </div>
                            </label>
                        </div>
                    `).join('');
                });
            } catch (e) { console.error("Error users:", e); }
        }

        // ระบบ LIFF Login
        async function initializeLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    checkUserPermission(profile);
                } else { liff.login(); }
            } catch (err) { console.error("LIFF Init Error: ", err); }
        }

        async function checkUserPermission(profile) {
            try {
                const res = await fetch(`${FIREBASE_URL}users/${profile.userId}.json?auth=${FIREBASE_SECRET}`);
                const userData = await res.json();

                document.getElementById('userImg').src = profile.pictureUrl;
                if (userData && userData.isActive) {
                    currentUser = { uid: profile.userId, ...userData };
                    document.getElementById('userName').innerText = userData.fullName;
                    
                    const roleBadge = document.getElementById('userRole');
                    if (userData.role === 'instructor') {
                        roleBadge.innerText = "⭐ อาจารย์ผู้คุม"; roleBadge.className = "text-[10px] text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full font-bold";
                    } else {
                        roleBadge.innerText = "🎓 นักศึกษาฝึกประสบการณ์"; roleBadge.className = "text-[10px] text-green-600 bg-green-100 px-2 py-0.5 rounded-full font-bold";
                    }
                } else {
                    document.getElementById('userName').innerText = "ไม่มีสิทธิ์เข้าถึง";
                    document.getElementById('userRole').innerText = "Unregistered";
                    document.getElementById('userRole').className = "text-[10px] text-red-600 bg-red-100 px-2 py-0.5 rounded-full";
                }
            } catch (e) { console.error("Check User Error:", e); }
        }

        function switchTab(tabId) {
            ['massage', 'midwifery', 'medicine'].forEach(id => {
                document.getElementById(`form-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.remove('active');
            });
            document.getElementById(`form-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // ส่งข้อมูลเข้า GAS
        async function submitForm(e, department) {
            e.preventDefault();
            if (!currentUser) return alert("รอกำลังเชื่อมต่อข้อมูลผู้ใช้งานครับ");

            // หาว่าเลือกอาจารย์คนไหน
            const selectedInstructor = document.querySelector(`input[name="instructor_${department}"]:checked`);
            if (!selectedInstructor) return alert("กรุณาเลือกอาจารย์ผู้ตรวจประเมินก่อนส่งเคสครับ");

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่งข้อมูล...`; btn.disabled = true;

            try {
                let payload = {
                    department: department,
                    studentUid: currentUser.uid,
                    studentName: currentUser.fullName,
                    instructorUid: selectedInstructor.value
                };

                if (department === 'massage') {
                    payload.date = document.getElementById('msg_date').value;
                    payload.hn = document.getElementById('msg_hn').value;
                    payload.patientName = document.getElementById('msg_patientName').value;
                    payload.caseType = document.getElementById('msg_caseType').value;
                    payload.diseaseCategory = document.getElementById('msg_diseaseCategory').value;
                    payload.diseaseName = document.getElementById('msg_diseaseName').value;
                    payload.painScore = document.getElementById('msg_painScore').value;
                } else if (department === 'midwifery') {
                    payload.date = document.getElementById('mid_date').value;
                    payload.hn = document.getElementById('mid_hn').value;
                    payload.patientName = document.getElementById('mid_patientName').value;
                    payload.bp = document.getElementById('mid_bp').value;
                    payload.latchScore = document.getElementById('mid_latchScore').value;
                    payload.treatment = document.getElementById('mid_treatment').value;
                } else if (department === 'medicine') {
                    payload.date = document.getElementById('med_date').value;
                    payload.hn = document.getElementById('med_hn').value;
                    payload.patientName = document.getElementById('med_patientName').value;
                    payload.caseType = document.getElementById('med_caseType').value;
                    payload.diseaseCategory = document.getElementById('med_diseaseCategory').value;
                    payload.diseaseName = document.getElementById('med_diseaseName').value;
                    payload.treatmentForm = document.getElementById('med_treatmentForm').value;
                }

                const res = await fetch(GAS_WEBAPP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
                const result = await res.json();
                
                if (result.success) {
                    alert(result.message);
                    e.target.reset(); // ล้างฟอร์ม
                    
                    // เซ็ตวันที่กลับคืน + คืนค่า Pain Score กลับเป็น 5
                    const today = new Date();
                    document.getElementById('msg_date').valueAsDate = today;
                    document.getElementById('mid_date').valueAsDate = today;
                    document.getElementById('med_date').valueAsDate = today;
                    if(department === 'massage') document.getElementById('painValue').innerText = '5';
                } else {
                    alert(result.message);
                }
            } catch (err) { alert("เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์"); }
            finally { btn.innerHTML = originalText; btn.disabled = false; }
        }
    </script>
</body>
</html>
